<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Frets</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="First Frets">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151310" media="(prefers-color-scheme: dark)">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.update{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:15px;max-width:calc(100% - 32px)}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: lesson rail on the left, one lesson at a time in a reading column; every diagram is something you can tap and hear. */
:root{
  --bg:#F1F0EC; --surface:#FFFFFF; --sunk:#E7E5DF; --ink:#1E1B18; --muted:#676767; --line:#D8D4CC;
  --accent:#F57C14; --accent-ink:#9A4204; --accent-soft:#FDE3CC;
  --good:#2E7D4F; --good-soft:#DDEFE3; --bad:#B23A28; --bad-soft:#F6DED8;
  --wood:#D9A86C; --wood-edge:#A9733A; --board:#3B2B22; --wire:#C8C2B8; --nut:#EFE6D2; --metal:#B9B2A6; --hole:#2A1D16;
  --f-display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px; --hl:#1668E3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151310; --surface:#201C18; --sunk:#2A2520; --ink:#F0EBE3; --muted:#A3A3A3; --line:#3B342D;
  --accent:#FF9433; --accent-ink:#FFBD85; --accent-soft:#422712;
  --good:#5DBB84; --good-soft:#1E3427; --bad:#E5735F; --bad-soft:#3D221D;
  --wood:#B88550; --wood-edge:#8A5C2E; --board:#0F0B09; --wire:#8F887E; --nut:#D8CFBB; --metal:#9C958A; --hole:#0A0705; --hl:#3D8BFF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151310; --surface:#201C18; --sunk:#2A2520; --ink:#F0EBE3; --muted:#A3A3A3; --line:#3B342D;
  --accent:#FF9433; --accent-ink:#FFBD85; --accent-soft:#422712;
  --good:#5DBB84; --good-soft:#1E3427; --bad:#E5735F; --bad-soft:#3D221D;
  --wood:#B88550; --wood-edge:#8A5C2E; --board:#0F0B09; --wire:#8F887E; --nut:#D8CFBB; --metal:#9C958A; --hole:#0A0705; --hl:#3D8BFF;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:.01em;line-height:1.02;text-wrap:balance;margin:0}
p{margin:0}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:22px}
.brand h1{font-size:44px;text-transform:uppercase}
.brand p{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:2px;list-style:none;margin:0;padding:0}
.nav button{display:grid;grid-template-columns:28px 1fr;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1.25}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav .n{font-family:var(--f-display);font-size:20px;font-weight:800;color:var(--muted)}
.nav button[aria-current="true"] .n{color:var(--accent-ink)}
main{padding-inline:clamp(16px,4vw,56px);padding-block:40px 80px;min-width:0}
.lesson{max-width:780px;display:flex;flex-direction:column;gap:34px}
.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.lesson>header{display:flex;flex-direction:column;gap:10px}
.lesson>header h2{font-size:clamp(48px,7vw,76px);text-transform:uppercase}
.lead{font-size:20px;color:var(--muted);max-width:62ch}
section.block{display:flex;flex-direction:column;gap:14px}
section.block>h3{font-size:30px;text-transform:uppercase}
.prose{display:flex;flex-direction:column;gap:12px;max-width:65ch}
p.prose{display:block}
ul.points{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px;max-width:65ch}
ul.points li::marker{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.callout{border-radius:var(--r);padding:14px 18px;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.callout b.t{font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.callout.warn{background:var(--bad-soft)}
.callout.warn b.t{color:var(--bad)}
.callout.tip{background:var(--accent-soft)}
.callout.tip b.t{color:var(--accent-ink)}
.callout.calm{background:var(--good-soft)}
.callout.calm b.t{color:var(--good)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cap{font-size:13px;color:var(--muted)}
.btn{border:1.5px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px;line-height:1.2;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1E1B18}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.feedback{min-height:1.55em;font-weight:700}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.twocol>*{min-width:0}
.pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:24px;flex-wrap:wrap}
.pager .btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 16px}
.pager .btn small{font-weight:400;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.pager .next{margin-left:auto;align-items:flex-end}
.chn{text-transform:none}
.tuner-live{display:flex;flex-direction:column;gap:14px}
.tuner-live .tl-msg{min-height:3.9em;line-height:1.3}   /* room for the longest message, so nothing below it jumps */
.tuner-live .gauge{max-width:360px}
.tuner-live .strpick .btn.heard{box-shadow:0 0 0 3px var(--hl)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tools .btn{padding:7px 14px;font-size:14px}
.tools .btn.icon{padding:6px 8px;display:inline-flex;align-items:center}
.settings{display:flex;flex-direction:column;gap:16px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.share-row{align-items:flex-start}
.share-url{font-family:var(--f-mono);font-size:13px;word-break:break-all;margin:6px 0 8px;user-select:all;-webkit-user-select:all}
.qr-box{width:170px;flex:none;background:#fff;border-radius:12px;padding:6px;box-shadow:0 0 0 1px var(--line)}
.qr-box svg{display:block;width:100%;height:auto}
.set-row>div:first-child{flex:1 1 220px;min-width:0}
.set-row select{font:inherit;font-size:15px;padding:7px 9px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.set-row input[type=range]{width:150px;accent-color:var(--accent)}
.vol-val{min-width:3em;font-variant-numeric:tabular-nums}
.settings .set-row+.set-row{border-top:1px solid var(--line);padding-top:14px}
.tmodal-card.wide{max-width:860px}
.chordchart{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.chordchart .chordcard{padding:8px 6px 10px}
.chordchart .chord{width:100%;max-width:170px}
.tmodal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;overflow:auto}
.tmodal-card{background:var(--bg);border-radius:16px;padding:18px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.tmodal-card h2{font-size:34px;text-transform:uppercase}
h4.subhead{font-family:var(--f-display);font-size:24px;text-transform:uppercase;margin:12px 0 0}
.fpop{font:inherit;color:var(--accent-ink);background:var(--accent-soft);border:0;border-bottom:2px dotted var(--accent);border-radius:4px;padding:0 4px;cursor:pointer}
.fpop-card{position:absolute;z-index:30;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.fpop-img{width:100%;aspect-ratio:300/344;overflow:hidden;border-radius:8px;background:#fff}
.fpop-img img{width:200%;max-width:none;display:block}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;padding:0 .4em;border-radius:99px;font-weight:700;font-size:.85em;color:#1E1B18;vertical-align:.08em}
/* svg pieces */
svg text{font-family:var(--f-body)}
.fb{display:block;width:100%;height:auto;touch-action:manipulation}
.fb-open{fill:var(--sunk)}
.fb-board{fill:var(--board)}
.fb-wire{stroke:var(--wire);stroke-width:3}
.fb-nut{fill:var(--nut)}
.fb-dot{fill:var(--nut);opacity:.85}
.fb-str{stroke:var(--metal)}
.fb-num{fill:var(--muted);font-size:13px;text-anchor:middle;font-variant-numeric:tabular-nums}
.fb-lbl{font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#1E1B18}
.fb-hit{fill:transparent;cursor:pointer}
.fb-hit:hover{fill:rgba(255,255,255,.08)}
.fb-mark text{font-size:16px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#1E1B18;pointer-events:none}
.fb-mark circle{pointer-events:none}
.fb-mark .dot{stroke:#fff;stroke-width:2.5;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
.fb-mark .halo{opacity:0;transform-box:fill-box;transform-origin:center}
.fb-mark.pop{animation:pop .25s ease-out}
.fb-mark.pop .halo{animation:halo .7s ease-out}
@keyframes halo{from{transform:scale(1);opacity:.75}to{transform:scale(2.1);opacity:0}}
@keyframes pop{from{transform:scale(.5);opacity:.3}to{transform:scale(1);opacity:1}}
.fb-mark{transform-box:fill-box;transform-origin:center}
.orient{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.fb-readout{font-family:var(--f-mono);font-size:14px;color:var(--muted);min-height:1.4em}
.tab{display:block;min-width:100%}
.tab line.l{stroke:var(--muted);stroke-width:1;opacity:.55}
.tab line.bar{stroke:var(--muted);stroke-width:1.5;opacity:.7}
.tab .tl{font-family:var(--f-mono);font-size:13px;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.tab .tn{font-family:var(--f-mono);font-size:16px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.tab .tb{fill:var(--surface)}
.tab .cur{fill:var(--accent-soft);opacity:0;transition:opacity .1s}
.tab .cur.on{opacity:1}
.tab .cur.ok,.tab .cur.no{transition:none;stroke-width:2}
.tab .cur.on.ok{fill:var(--good-soft);stroke:var(--good)}
.tab .cur.on.no{fill:var(--bad-soft);stroke:var(--bad)}
.tab .mk{opacity:0;pointer-events:none;transform-box:fill-box;transform-origin:center}
.tab .mk.ok,.tab .mk.no{opacity:1;animation:pop .25s ease-out}
.tab .mk circle{stroke:var(--surface);stroke-width:2}
.tab .mk.ok circle{fill:var(--good)} .tab .mk.no circle{fill:var(--bad)}
.tab .mk path{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:none}
.tab .mk.ok .tick,.tab .mk.no .x{display:inline}
.tab .col{cursor:pointer}
.tab .ch{font-family:var(--f-display);font-weight:800;font-size:20px;fill:var(--accent-ink)}
.player{display:flex;flex-direction:column;gap:12px}
.player .tabbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 4px}
.player select{font:inherit;font-size:15px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.song{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.song h3{font-size:30px;text-transform:uppercase}
.song .sub{color:var(--muted)}
.drill,.nc{display:flex;flex-direction:column;gap:12px}
.nc-tune{display:block;margin-top:10px}
.nc-tune .btn{display:block;margin-top:8px}
.drill .tabbox,.nc .fbbox{background:var(--surface)}
.nc-target{display:flex;align-items:center;gap:8px;font-size:20px;padding:8px 10px;margin:0 -10px;border-radius:8px}
.nc-target.ok{background:var(--good-soft);box-shadow:inset 0 0 0 2px var(--good)}
.nc-target.no{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad)}
.nc-target.ok::after,.nc-target.no::after{margin-left:auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:16px;font-weight:800;line-height:1;animation:pop .25s ease-out}
.nc-target.ok::after{content:'✓';background:var(--good)} .nc-target.no::after{content:'✕';background:var(--bad)}
.fs{display:block;width:100%;height:auto;touch-action:manipulation}
.fsw{display:flex;flex-direction:column;gap:10px}
.vf{display:flex;flex-direction:column;gap:12px}
.vf-panels{display:flex;flex-wrap:wrap;gap:12px 24px}
.vf-panels figure{flex:1 1 200px;max-width:340px;margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.vf-panels figcaption{font-family:var(--f-display);font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.vf svg{width:100%;height:auto;display:block;touch-action:manipulation}
.vf-tab{stroke:var(--muted);stroke-width:1.5}
.vf-zb{fill:var(--surface)}
.vf-zero{font-size:17px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.vf-side{font-size:17px;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.vf-s{transition:transform .8s ease}
.vf-hit{fill:transparent;cursor:pointer}
.vf-row.lit circle{animation:vf-pop .6s ease;transform-box:fill-box;transform-origin:center}
@keyframes vf-pop{50%{transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.vf-s{transition:none}}
.fs-body{fill:var(--sunk);stroke:var(--line);stroke-width:2}
.fs-hole{fill:var(--bg);stroke:var(--line);stroke-width:3}
.fs-bridge{fill:var(--nut)}
.sh-wood{fill:var(--wood)}
.sh-hole{fill:var(--hole);stroke:var(--wood-edge);stroke-width:8}
.fs-str{stroke:var(--metal);transition:opacity .2s}
.fs-str.dim{opacity:.3}
.fs-lit{stroke-width:5;stroke-linecap:round;stroke-dasharray:14 10;animation:fs-flow .9s linear infinite;pointer-events:none}
@keyframes fs-flow{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){.fs-lit{animation:none}}
.fs-live circle,.fs-live text{pointer-events:none}
.fs-in{font-size:15px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#1E1B18}
.fs-thumb{fill:none;stroke-width:4}
.fs-tl{font-size:15px;font-weight:700;text-anchor:middle;fill:var(--ink)}
.chord{width:170px;flex:none}
.chord .grid line{stroke:var(--muted)}
.chord .nutbar{fill:var(--ink)}
.chord .dot{fill:var(--ink)}
.chord .fn{fill:var(--surface);font-size:14px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.chord .om{fill:none;stroke:var(--ink);stroke-width:2}
.chord .xm{stroke:var(--ink);stroke-width:2.2}
.chord .sn{font-size:13px;font-weight:700;text-anchor:middle}
.chord .lab{font-size:11px;fill:var(--muted);text-anchor:middle;letter-spacing:.08em;text-transform:uppercase}
.chord .frl{font-size:12px;font-weight:700;fill:var(--muted);text-anchor:end;dominant-baseline:central}
.chord .rootring{fill:none;stroke:var(--accent);stroke-width:3}
.chord .name{font-family:var(--f-display);font-weight:800;font-size:30px;fill:var(--ink);text-anchor:middle}
.chords{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.chordcard{display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 14px;cursor:pointer}
.chordcard:hover{border-color:var(--accent)}
.anat{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:24px;align-items:start}
.anat svg{width:100%;max-width:280px;height:auto;display:block;margin:0 auto}
.anat .hit{fill:transparent;cursor:pointer}
.anat .hl{fill:var(--hl);fill-opacity:.22;stroke:var(--hl);stroke-width:3.5;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none;opacity:0;transition:opacity .15s;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff)}
.anat .hl *{vector-effect:non-scaling-stroke}
.anat figure{gap:6px}
.credit{font-size:11px;text-align:center}
.an-fret{fill:var(--muted);font-size:20px;font-weight:700;dominant-baseline:central}
.an-lbl{fill:var(--ink);font-size:22px;font-weight:700}
.g-ink{fill:var(--ink)}
.an-num{fill:#1E1B18;font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.credit a{color:inherit}
.anat .hl.on{opacity:1}
.parts{display:flex;flex-wrap:wrap;gap:6px}
.parts .btn{font-size:14px;padding:7px 11px}
.partinfo{display:flex;flex-direction:column;gap:6px}
.partinfo h4{font-family:var(--f-display);font-size:28px;text-transform:uppercase;margin:0}
.body-wood{fill:var(--wood)} .body-edge{fill:var(--wood-edge)} .hole{fill:var(--hole)} .ros{fill:none;stroke:var(--wood-edge);stroke-width:3}
.hs-wood{fill:var(--board)} .peg{fill:var(--metal)} .post{fill:var(--nut)}
.bridge{fill:var(--board)} .metal{stroke:var(--metal)}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.term h4{font-family:var(--f-display);font-size:26px;text-transform:uppercase;margin:0}
.term .say{font-size:14px;display:flex;flex-direction:column;gap:2px}
.term .say .y{color:var(--good);font-weight:700}
.term .say .n{color:var(--bad);font-weight:700;text-decoration:line-through;text-decoration-thickness:1.5px}
.qz{display:flex;flex-direction:column;gap:10px}
.qitem{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.qitem:first-child{border-top:0;padding-top:0}
.qitem .btn.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.qitem .btn.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
figure{margin:0;display:flex;flex-direction:column;gap:8px}
figure img{border-radius:var(--r);background:#fff;display:block}

<script>
"use strict";
/* ---------- data ---------- */
const STR={
  1:{name:'e',freq:329.63,color:'#E8BE2C'},
  2:{name:'B',freq:246.94,color:'#EE9638'},
  3:{name:'G',freq:196.00,color:'#E067A3'},
  4:{name:'D',freq:146.83,color:'#4DB36A'},
  5:{name:'A',freq:110.00,color:'#5B9BEA'},
  6:{name:'E',freq:82.41, color:'#E2574B'}
};
const ORD=['','1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th','11th','12th'];
const NOTES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const freqOf=(s,f)=>STR[s].freq*Math.pow(2,f/12);
const noteOf=(s,f)=>NOTES[Math.round(69+12*Math.log2(freqOf(s,f)/440))%12];
// Strings are labelled 1–6 everywhere except the Tuning page, which teaches the letter names (pill(s,true)).
const pill=(s,name)=>`<span class="pill" style="background:${STR[s].color}">${name?STR[s].name:s}</span>`;
const strDesc=s=>`string ${s}`;

/* ---------- storage (per-viewer convenience only) ---------- */
const store={get(k,d){try{const v=localStorage.getItem('bg.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem('bg.'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- audio: Karplus-Strong plucked string ---------- */
let AC=null,OUT=null;
function audio(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();
    const comp=AC.createDynamicsCompressor();OUT=AC.createGain();OUT.gain.value=.9*store.get('volume',1);OUT.connect(comp);comp.connect(AC.destination);}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
// Notes still sounding, so a player's Stop can silence them all at once (see hush).
let VOICES=[];
// The app's own sound ends around this time (performance.now() ms), so the microphone listener can ignore it.
let SOUND_UNTIL=0;
// hold: seconds before the note is damped, like a finger lifting or the next note on that string.
// Without it the note rings out on its own.
function pluck(freq,{delay=0,dur=2.6,vol=.55,mode='clean',hold=null}={}){
  const c=audio();if(!c)return;
  const muted=mode==='mute',held=hold!=null&&!muted;
  const sr=c.sampleRate,len=Math.floor(sr*(muted?.3:held?Math.min(dur,hold+.3):dur));
  const buf=c.createBuffer(1,len,sr),d=buf.getChannelData(0);
  const P=Math.max(2,Math.round(sr/freq-.5)),ring=new Float32Array(P);
  for(let i=0;i<P;i++)ring[i]=Math.random()*2-1;
  for(let k=0;k<3;k++)for(let i=1;i<P;i++)ring[i]=(ring[i]+ring[i-1])*.5; // soft thumb attack
  let m=0;for(let i=0;i<P;i++)m+=ring[i];m/=P;for(let i=0;i<P;i++)ring[i]-=m;
  const loss=muted?.82:.997;let idx=0;
  for(let i=0;i<len;i++){const nx=idx+1===P?0:idx+1,v=ring[idx];d[i]=v;ring[idx]=loss*.5*(v+ring[nx]);idx=nx;}
  if(mode==='buzz'){for(let i=0;i<len;i++){const v=d[i];d[i]=Math.tanh(v*6)*.6+(Math.random()*2-1)*Math.min(1,Math.abs(v)*5)*.35*Math.exp(-i/(sr*.9));}}
  let pk=0;for(let i=0;i<len;i++)pk=Math.max(pk,Math.abs(d[i]));if(pk)for(let i=0;i<len;i++)d[i]/=pk;
  const src=c.createBufferSource(),g=c.createGain(),t=c.currentTime+delay+.01;
  src.buffer=buf;g.gain.setValueAtTime(vol,t);
  if(held)g.gain.setTargetAtTime(0,t+hold,.025);else g.gain.setTargetAtTime(0,t+(muted?.1:dur*.75),.12);
  src.connect(g);g.connect(OUT);src.start(t);src.stop(t+len/sr+.6);
  const end=t+len/sr+.6;VOICES=VOICES.filter(v=>v.end>c.currentTime);VOICES.push({g,end});
  SOUND_UNTIL=Math.max(SOUND_UNTIL,performance.now()+(delay+(held?hold+.15:dur))*1000+250);
}
// Silence everything still ringing, like laying a hand flat on the strings.
function hush(){
  if(!AC)return;const t=AC.currentTime;
  VOICES.forEach(({g})=>{const v=g.gain.value;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(v,t);g.gain.setTargetAtTime(0,t,.02);});
  VOICES=[];SOUND_UNTIL=Math.min(SOUND_UNTIL,performance.now()+300);
}
// A short click for count-ins (the first beat is higher).
function metroClick(delay=0,first=false){
  const c=audio();if(!c)return;const t=c.currentTime+delay+.01,o=c.createOscillator(),g=c.createGain();
  o.frequency.value=first?1500:1000;g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);
  o.connect(g);g.connect(OUT);o.start(t);o.stop(t+.1);SOUND_UNTIL=Math.max(SOUND_UNTIL,performance.now()+(delay+.4)*1000);
}
const playNote=(s,f,o)=>pluck(freqOf(s,f),o);
function strum(notes,gap=.03,o={}){[...notes].sort((a,b)=>b[0]-a[0]).forEach(([s,f],i)=>playNote(s,f,{delay:i*gap,vol:.38,...o,hold:o.hold==null?null:Math.max(.05,o.hold-i*gap)}));}

/* ---------- helpers ---------- */
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;};
const mount=(root,name,node)=>{const slot=root.querySelector(`[data-w="${name}"]`);if(slot)slot.replaceWith(node);};

/* ---------- fretboard (player's view: headstock left, thinnest string on top) ---------- */
function Fretboard({frets=7,phoneFrets=null,onTap=null,readout=true,orient=true,hint='Tap anywhere on the neck to hear that note.',hole=false}={}){
  if(hole)return Soundhole({onTap,readout,hint:hint==='Tap anywhere on the neck to hear that note.'?'Tap a string to hear it.':hint});
  // On phone-width screens, a long neck shows fewer frets so it fits without sideways scrolling.
  if(phoneFrets&&window.matchMedia('(max-width: 600px)').matches)frets=Math.min(frets,phoneFrets);
  const W=frets<=7?640:900,x0=86,x1=W-14,gy=30,sy=s=>24+(s-1)*gy,top=10,bot=sy(6)+14,H=bot+28;
  const span=1-Math.pow(2,-frets/12);
  const fx=f=>f<=0?x0:x0+(x1-x0)*(1-Math.pow(2,-f/12))/span;
  const mx=f=>f===0?56:fx(f)-(fx(f)-fx(f-1))*.3;
  let s=`<svg class="fb" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fretboard, ${frets} frets. Headstock on the left, thinnest string on top.">`;
  s+=`<rect class="fb-open" x="34" y="${top}" width="${x0-42}" height="${bot-top}" rx="6"/>`;
  s+=`<rect class="fb-board" x="${x0}" y="${top}" width="${x1-x0}" height="${bot-top}"/>`;
  const mid=(sy(1)+sy(6))/2;
  // Dots match the Martin in the photos: 5, 7 (double), 9, 12 (double).
  [5,7,9,12].filter(f=>f<=frets).forEach(f=>{const cx=(fx(f-1)+fx(f))/2;
    if(f===7||f===12)s+=`<circle class="fb-dot" cx="${cx}" cy="${sy(2)+gy/2}" r="6"/><circle class="fb-dot" cx="${cx}" cy="${sy(4)+gy/2}" r="6"/>`;
    else s+=`<circle class="fb-dot" cx="${cx}" cy="${mid}" r="6"/>`;});
  for(let f=1;f<=frets;f++)s+=`<line class="fb-wire" x1="${fx(f)}" x2="${fx(f)}" y1="${top}" y2="${bot}"/>`;
  s+=`<rect class="fb-nut" x="${x0-7}" y="${top-2}" width="8" height="${bot-top+4}" rx="2"/>`;
  for(let k=1;k<=6;k++)s+=`<line class="fb-str" x1="34" x2="${x1}" y1="${sy(k)}" y2="${sy(k)}" stroke-width="${(.9+(k-1)*.5).toFixed(2)}"/>`;
  for(let k=1;k<=6;k++)s+=`<circle cx="15" cy="${sy(k)}" r="11" fill="${STR[k].color}"/><text class="fb-lbl" x="15" y="${sy(k)}">${k}</text>`;
  s+=`<text class="fb-num" x="56" y="${H-8}">open</text>`;
  for(let f=1;f<=frets;f++)s+=`<text class="fb-num" x="${(fx(f-1)+fx(f))/2}" y="${H-8}">${f}</text>`;
  for(let k=1;k<=6;k++)for(let f=0;f<=frets;f++){
    const a=f===0?34:fx(f-1),b=f===0?x0:fx(f);
    s+=`<rect class="fb-hit" data-s="${k}" data-f="${f}" x="${a}" y="${sy(k)-gy/2}" width="${b-a}" height="${gy}"><title>${strDesc(k)}, ${f?('fret '+f):'open'}</title></rect>`;}
  s+=`<g class="fb-marks"></g></svg>`;
  const el=h(`<div class="fbw"><div class="scroll">${s}</div>
    ${orient?'<div class="orient"><span>← toward the headstock</span><span>Thinnest string on top</span><span>toward the body →</span></div>':''}
    ${readout?`<div class="fb-readout" aria-live="polite">${hint}</div>`:''}</div>`);
  const marksG=el.querySelector('.fb-marks'),ro=el.querySelector('.fb-readout');
  let base=[];
  function draw(list,popKey){
    marksG.innerHTML=list.map(m=>{const x=mx(m.f),y=sy(m.s),open=m.f===0;
      // Big filled dot in the string's color (open strings too), with a ring that pulses out when the note sounds.
      return `<g class="fb-mark${open?' open':''}${popKey&&m.pop?' pop':''}"><circle class="halo" cx="${x}" cy="${y}" r="15" fill="${STR[m.s].color}"/><circle class="dot" cx="${x}" cy="${y}" r="14.5" fill="${STR[m.s].color}"/><text x="${x}" y="${y}">${m.label??(store.get('dots','fret')==='note'?noteOf(m.s,m.f):m.f)}</text></g>`;}).join('');
  }
  let tmo;
  const api={el,
    setMarks(list){base=list.map(m=>({...m,pop:true}));draw(base,true);},
    flash(s,f){clearTimeout(tmo);draw([...base.filter(m=>!(m.s===s)),{s,f,pop:true}],true);tmo=setTimeout(()=>draw(base),900);},
    say(t){if(ro)ro.innerHTML=t;}
  };
  el.querySelector('svg').addEventListener('click',e=>{
    const t=e.target.closest('[data-s]');if(!t)return;
    const s=+t.dataset.s,f=+t.dataset.f;
    if(onTap&&onTap(s,f,api)===false)return;
    playNote(s,f);api.flash(s,f);
    api.say(`${pill(s)} ${strDesc(s)} · ${f?`fret ${f}`:'open (fret 0)'} · note ${noteOf(s,f)}`);
  });
  return api;
}

// Open strings only (Reading Tab: Right Hand, step 1): the strings where the thumb plucks them, over the soundhole, instead of the
// neck. Lap view: neck to the left, thinnest string on top. Same API as Fretboard (setMarks, flash, say); every tap is fret 0.
function Soundhole({onTap=null,readout=true,hint='Tap a string to hear it.'}={}){
  const W=640,gy=30,sy=k=>40+(k-1)*gy,H=sy(6)+40,cx=330,cy=(sy(1)+sy(6))/2;
  let s=`<svg class="fb sh" viewBox="0 0 ${W} ${H}" role="img" aria-label="The strings over the soundhole, neck on the left, thinnest string on top.">`;
  // String numbers sit in the margin on the right (David, 2026-11-10).
  s+=`<rect class="sh-wood" x="0" y="4" width="${W-34}" height="${H-8}" rx="10"/>`;
  s+=`<rect class="fb-board" x="0" y="${sy(1)-16}" width="160" height="${sy(6)-sy(1)+32}"/>`;
  [50,106].forEach(x=>{s+=`<line class="fb-wire" x1="${x}" x2="${x}" y1="${sy(1)-16}" y2="${sy(6)+16}"/>`;});
  s+=`<circle class="sh-hole" cx="${cx}" cy="${cy}" r="${cy-14}"/><rect class="fs-bridge" x="${W-64}" y="${sy(1)-12}" width="14" height="${sy(6)-sy(1)+24}" rx="3"/>`;
  for(let k=1;k<=6;k++)s+=`<line class="fb-str" x1="0" x2="${W-57}" y1="${sy(k)}" y2="${sy(k)}" stroke-width="${(.9+(k-1)*.5).toFixed(2)}"/>`;
  for(let k=1;k<=6;k++)s+=`<circle cx="${W-15}" cy="${sy(k)}" r="11" fill="${STR[k].color}"/><text class="fb-lbl" x="${W-15}" y="${sy(k)}">${k}</text>`;
  for(let k=1;k<=6;k++)s+=`<rect class="fb-hit" data-s="${k}" data-f="0" x="0" y="${sy(k)-gy/2}" width="${W}" height="${gy}"><title>${strDesc(k)}, open</title></rect>`;
  s+=`<g class="fb-marks"></g></svg>`;
  const el=h(`<div class="fbw"><div class="scroll">${s}</div>${readout?`<div class="fb-readout" aria-live="polite">${hint}</div>`:''}</div>`);
  const marksG=el.querySelector('.fb-marks'),ro=el.querySelector('.fb-readout');
  let base=[],tmo;
  function draw(list,popKey){
    marksG.innerHTML=list.map(m=>{const y=sy(m.s);
      return `<g class="fb-mark open${popKey&&m.pop?' pop':''}"><circle class="halo" cx="${cx}" cy="${y}" r="15" fill="${STR[m.s].color}"/><circle class="dot" cx="${cx}" cy="${y}" r="14.5" fill="${STR[m.s].color}"/><text x="${cx}" y="${y}">${m.label??(store.get('dots','fret')==='note'?noteOf(m.s,0):0)}</text></g>`;}).join('');
  }
  const api={el,
    setMarks(list){base=list.map(m=>({...m,pop:true}));draw(base,true);},
    flash(s){clearTimeout(tmo);draw([...base.filter(m=>m.s!==s),{s,f:0,pop:true}],true);tmo=setTimeout(()=>draw(base),900);},
    say(t){if(ro)ro.innerHTML=t;}
  };
  el.querySelector('svg').addEventListener('click',e=>{
    const t=e.target.closest('[data-s]');if(!t)return;const s=+t.dataset.s;
    if(onTap&&onTap(s,0,api)===false)return;
    playNote(s,0);api.flash(s);api.say(`${pill(s)} ${strDesc(s)} · open (fret 0) · note ${noteOf(s,0)}`);
  });
  return api;
}

/* ---------- tab ---------- */
function Tab(events,{onCol,badge=false}={}){
  const colW=44,x0=48,hasCh=events.some(e=>e.c),top=hasCh?40:badge?38:18,ly=s=>top+(s-1)*20,W=x0+events.length*colW+14,H=ly(6)+16;
  let s=`<svg class="tab" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Tab">`;
  events.forEach((e,i)=>{s+=`<rect class="cur" data-c="${i}" x="${x0+i*colW+3}" y="${ly(1)-12}" width="${colW-6}" height="${ly(6)-ly(1)+24}" rx="6"/>`;});
  for(let k=1;k<=6;k++){s+=`<line class="l" x1="${x0-12}" x2="${W-10}" y1="${ly(k)}" y2="${ly(k)}"/><text class="tl" x="18" y="${ly(k)}">${k}</text>`;}
  s+=`<line class="bar" x1="${x0-12}" x2="${x0-12}" y1="${ly(1)}" y2="${ly(6)}"/><line class="bar" x1="${W-10}" x2="${W-10}" y1="${ly(1)}" y2="${ly(6)}"/>`;
  events.forEach((e,i)=>{
    const cx=x0+i*colW+colW/2;
    if(e.c&&(i===0||events[i-1].c!==e.c))s+=`<text class="ch" x="${cx-10}" y="20">${e.c}</text>`;
    if(e.bar&&i<events.length-1)s+=`<line class="bar" x1="${x0+(i+1)*colW}" x2="${x0+(i+1)*colW}" y1="${ly(1)}" y2="${ly(6)}"/>`;
    s+=`<g class="col" data-i="${i}"><rect x="${x0+i*colW}" y="${ly(1)-12}" width="${colW}" height="${ly(6)-ly(1)+24}" fill="transparent"/>`;
    e.n.forEach(([st,f])=>{s+=`<rect class="tb" x="${cx-11}" y="${ly(st)-9}" width="22" height="18"/><text class="tn" x="${cx}" y="${ly(st)}">${f}</text>`;});
    s+=`</g>`;
  });
  // Right/wrong badge over each column (tick or cross), shown by mark().
  if(badge)events.forEach((e,i)=>{const cx=x0+i*colW+colW/2,cy=ly(1)-24;
    s+=`<g class="mk" data-c="${i}"><circle cx="${cx}" cy="${cy}" r="10"/><path class="tick" d="M${cx-4.5} ${cy} l3 3.2 l6 -6.6"/><path class="x" d="M${cx-3.5} ${cy-3.5} l7 7 M${cx+3.5} ${cy-3.5} l-7 7"/></g>`;});
  s+=`</svg>`;
  const el=h(s);
  el.addEventListener('click',e=>{const g=e.target.closest('.col');if(g&&onCol)onCol(+g.dataset.i);});
  let markT;
  return {el,
    // Turns the highlight bar green ('ok') or red ('no') the moment a note is judged. Red fades back to orange for another try.
    mark(kind){const r=el.querySelector('.cur.on');if(!r)return;clearTimeout(markT);
      const els=[r,el.querySelector(`.mk[data-c="${r.dataset.c}"]`)].filter(Boolean);
      els.forEach(x=>x.classList.remove('ok','no'));void r.getBoundingClientRect();
      els.forEach(x=>x.classList.add(kind));if(kind==='no')markT=setTimeout(()=>els.forEach(x=>x.classList.remove('no')),1500);},
    setCur(i){clearTimeout(markT);el.querySelectorAll('.mk').forEach(m=>m.classList.remove('ok','no'));
      el.querySelectorAll('.cur').forEach(r=>{r.classList.remove('ok','no');r.classList.toggle('on',+r.dataset.c===i);});
    const r=el.querySelector(`.cur[data-c="${i}"]`);const sc=el.closest('.scroll');
    if(r&&sc&&sc.scrollWidth>sc.clientWidth){const x=+r.getAttribute('x');sc.scrollTo({left:Math.max(0,x-sc.clientWidth/3),behavior:'smooth'});}}};
}

/* ---------- song player: tab + fretboard in sync ---------- */
let STOP_ALL=[];
// ring: notes are held down and left to ring (arpeggios), so each one sounds until its string is played again.
// Otherwise a note lasts as long as it's written, the way a finger lifts as the next note starts. Chords last
// until the next chord or note; the last note always rings out. A note can set its own: ring:true, or hold (beats).
// count: beats of count-in clicks before the first note. finger: say which finger plays each fretted note
// (one finger per fret, so in frets 1–4 the finger number is the fret number).
// listen: adds Start listening. The student plays the tab on their guitar one note at a time; the microphone
// checks each one (green tick / red cross on the tab) and moves on. Single notes only, no chords.
function Player(song,{frets=7,phoneFrets=null,bpm=80,ring=false,count=0,finger=false,hole=false,listen=false}={}){
  const el=h(`<div class="player">
    <div class="row"><button class="btn primary play" type="button">▶ Play</button>
      <label class="row" style="gap:6px">Speed <select aria-label="Speed"><option value="40">Very slow</option><option value="55">Slow</option><option value="70">Medium</option><option value="95">Full</option></select></label>
      ${listen?'<button class="btn pl-mic" type="button"></button>':''}
      <span class="cap">Tap any column to hear it on its own.</span></div>
    <div class="scroll tabbox"></div><div class="fbbox"></div>
    ${listen?'<div class="feedback" aria-live="polite"></div><p class="cap">Start listening, then play the tab on your guitar one note at a time. The highlighted note is the next one. Nothing is recorded or sent anywhere.</p>':''}</div>`);
  const sel=el.querySelector('select');sel.value=String(bpm<=45?40:bpm<=60?55:bpm<=80?70:95);
  const sp=store.get('speed','lesson');if(sp!=='lesson')sel.value=String(sp);
  const fb=Fretboard({frets,phoneFrets,orient:false,hint:'',hole});
  const fing=f=>finger&&f>0&&f<5?` · finger ${f}`:'';
  const describe=e=>e.n.length>1?`${e.c?`<b>${e.c}</b> · `:''}${e.n.length} strings together, thickest to thinnest in one stroke`:`${pill(e.n[0][0])} ${strDesc(e.n[0][0])} · ${e.n[0][1]?`fret ${e.n[0][1]}${fing(e.n[0][1])}`:'open (0) — still pluck it'}`;
  const show=i=>{const e=song[i];tab.setCur(i);fb.setMarks(e.n.map(([s,f])=>({s,f})));fb.say(describe(e));};
  // How many beats note i sounds for (null: let it ring out).
  const beats=i=>{const e=song[i];if(e.hold!=null)return e.hold;if(i===song.length-1)return null;
    if(e.n.length>1||!(ring||e.ring))return e.b;
    let b=e.b;for(let j=i+1;j<song.length;j++){const x=song[j];if(x.n.length>1||x.n.some(([s])=>s===e.n[0][0]))return b;b+=x.b;}
    return null;};
  const sound=(i,spb)=>{const e=song[i],b=spb?beats(i):null,o=b==null?{}:{hold:b*spb};
    e.n.length>1?strum(e.n,.03,o):playNote(e.n[0][0],e.n[0][1],o);};
  const tab=Tab(song,{badge:listen,onCol:i=>{stop();show(i);sound(i);if(listen&&mic.on){at=i;busy=false;}}});
  el.querySelector('.tabbox').append(tab.el);el.querySelector('.fbbox').append(fb.el);
  const btn=el.querySelector('.play');let timers=[],playing=false;
  const finish=()=>{timers.forEach(clearTimeout);timers=[];playing=false;btn.textContent='▶ Play';};
  function stop(){const was=playing;finish();if(was)hush();}
  function play(){STOP_ALL.forEach(f=>f());if(listen&&mic.on){mic.stop();label();}audio();const spb=60/+sel.value;let t=.15;
    for(let k=0;k<count;k++){const n=k+1;metroClick(t,k===0);timers.push(setTimeout(()=>fb.say(`Get ready: ${Array.from({length:count},(_,j)=>j<n?`<b>${j+1}</b>`:j+1).join(' ')}`),t*1000));t+=spb;}
    song.forEach((e,i)=>{timers.push(setTimeout(()=>{show(i);sound(i,spb);},t*1000));t+=e.b*spb;});
    timers.push(setTimeout(()=>{finish();tab.setCur(-1);},t*1000+300));playing=true;btn.textContent='■ Stop';}
  btn.addEventListener('click',()=>playing?stop():play());
  STOP_ALL.push(stop);
  let at=0,busy=false,mic,label;
  if(listen){
    const fbk=el.querySelector('.feedback'),say=(t,cls='')=>{fbk.className='feedback '+cls;fbk.innerHTML=t;};
    mic=Listener({onNote:m=>{if(busy||at>=song.length)return;const [ts,tf]=song[at].n[0],r=judgeNote(m,ts,tf);
        if(!r.ok){tab.mark('no');say(r.t,'no');return;}
        tab.mark('ok');say(`Yes! ${pill(ts)} string ${ts}, ${where(ts,tf)}.`,'ok');busy=true;
        setTimeout(()=>{busy=false;at++;
          if(at>=song.length){tab.setCur(-1);say('You played the whole thing. Nice work! Start listening again to go once more.','ok');mic.stop();label();}
          else show(at);},450);},
      onMsg:t=>say(t,'no'),onStop:()=>label()});
    label=micToggle(mic,el.querySelector('.pl-mic'),{onStart:()=>{stop();at=0;busy=false;show(0);say('Listening… play the highlighted note on your guitar.');}});
  }
  return el;
}

/* ---------- chord diagram (headstock at top, thicker strings on the left) ---------- */
// base: the fret shown on the top row (1 = open position, with the nut). Higher up the neck the nut bar becomes a
// thin line, the grid moves right a little and "5fr" sits beside the top row. roots: strings whose note is the chord's root (orange ring).
function Chord({name,frets,fingers={},barre=null,base=1,roots=[]}){
  const ox=base>1?14:0,xs=k=>28+ox+(6-k)*24,ny=58,fy=j=>ny+j*34,ry=f=>fy(f-base+1)-17;
  let s=`<svg class="chord" viewBox="0 0 176 236" role="img" aria-label="${name} chord diagram${base>1?`, starting at fret ${base}`:''}">`;
  s+=`<text class="name" x="${88+ox}" y="28">${name}</text>`;
  s+=`<g class="grid">`;for(let k=1;k<=6;k++)s+=`<line x1="${xs(k)}" x2="${xs(k)}" y1="${ny}" y2="${fy(4)}" stroke-width="${(.8+(k-1)*.35).toFixed(2)}"/>`;
  for(let j=base>1?0:1;j<=4;j++)s+=`<line x1="${xs(6)}" x2="${xs(1)}" y1="${fy(j)}" y2="${fy(j)}"/>`;s+=`</g>`;
  if(base>1)s+=`<text class="frl" x="${xs(6)-13}" y="${ry(base)}">${base}fr</text>`;
  else s+=`<rect class="nutbar" x="${xs(6)-1}" y="${ny-5}" width="${xs(1)-xs(6)+2}" height="6"/>`;
  // One finger pressing two or more strings (e.g. F's index finger on the B and e strings).
  if(barre)s+=`<rect class="dot" x="${xs(barre.from)-10}" y="${ry(barre.fret)-10}" width="${xs(barre.to)-xs(barre.from)+20}" height="20" rx="10"/>`;
  for(let k=1;k<=6;k++){const f=frets[k];
    if(f==='x'){const x=xs(k),y=ny-16;s+=`<line class="xm" x1="${x-5}" y1="${y-5}" x2="${x+5}" y2="${y+5}"/><line class="xm" x1="${x+5}" y1="${y-5}" x2="${x-5}" y2="${y+5}"/>`;}
    else if(f===0)s+=`<circle class="om" cx="${xs(k)}" cy="${ny-16}" r="6"/>`;
    else s+=`<circle class="dot" cx="${xs(k)}" cy="${ry(f)}" r="10"/><text class="fn" x="${xs(k)}" y="${ry(f)}">${fingers[k]||''}</text>`;
    if(roots.includes(k)&&f!=='x')s+=`<circle class="rootring" cx="${xs(k)}" cy="${f===0?ny-16:ry(f)}" r="${f===0?9:13.5}"/>`;}
  for(let k=1;k<=6;k++)s+=`<text class="sn" x="${xs(k)}" y="${fy(4)+20}" fill="${STR[k].color}">${k}</text>`;
  s+=`</svg>`;
  const notes=Object.entries(frets).filter(([k,f])=>f!=='x').map(([k,f])=>[+k,f]);
  const el=h(`<button type="button" class="chordcard" aria-label="Strum ${name}">${s}<span class="cap">Tap to strum</span></button>`);
  el.addEventListener('click',()=>strum(notes));
  return el;
}
const CH={
  Em:{name:'Em',frets:{6:0,5:2,4:2,3:0,2:0,1:0},fingers:{5:2,4:3}},
  Am:{name:'Am',frets:{6:'x',5:0,4:2,3:2,2:1,1:0},fingers:{4:2,3:3,2:1}},
  A:{name:'A',frets:{6:'x',5:0,4:2,3:2,2:2,1:0},fingers:{4:1,3:2,2:3}},
  B7:{name:'B7',frets:{6:'x',5:2,4:1,3:2,2:0,1:2},fingers:{5:2,4:1,3:3,1:4}},
  C:{name:'C',frets:{6:'x',5:3,4:2,3:0,2:1,1:0},fingers:{5:3,4:2,2:1}},
  D:{name:'D',frets:{6:'x',5:'x',4:0,3:2,2:3,1:2},fingers:{3:1,2:3,1:2}},
  E:{name:'E',frets:{6:0,5:2,4:2,3:1,2:0,1:0},fingers:{5:2,4:3,3:1}},
  // Small F: no 5th or 6th string; index finger covers the B and e strings at fret 1.
  F:{name:'F',frets:{6:'x',5:'x',4:3,3:2,2:1,1:1},fingers:{4:3,3:2,2:1,1:1},barre:{fret:1,from:2,to:1}},
  G:{name:'G',frets:{6:3,5:2,4:0,3:0,2:0,1:3},fingers:{6:2,5:1,1:3}}
};
// The open "cowboy" chords, in the order shown in the Chords pop-up.
const COWBOY=['A','Am','B7','C','D','E','F','Em','G'];
const EM=[[6,0],[5,2],[4,2],[3,0],[2,0],[1,0]],AM=[[5,0],[4,2],[3,2],[2,1],[1,0]];

/* ---------- songs ---------- */
const N=(s,f,b=1,extra={})=>({n:[[s,f]],b,...extra});
// A tune from [string, fret, beats] notes (beats default to 1), with a bar line every perBar beats.
// start: beats already gone in the first bar, for a tune that starts with a pickup.
const tune=(notes,perBar,start=0)=>{let t=start;return notes.map(([s,f,b=1])=>{t+=b;const r=t/perBar;return N(s,f,b,Math.abs(r-Math.round(r))<1e-6?{bar:true}:{});});};
// First-position notes for the melodies, and the two-note power chord shapes.
const G3=[3,0],A3=[3,2],B3=[2,0],C4=[2,1],D4=[2,3],E4=[1,0],F4=[1,1],G4=[1,3];

// Live tuner (same as Page Fright's): listens through the microphone and shows how far the string is from its target.
/* Pitch: the McLeod Pitch Method (what the better web tuners use). The normalized square-difference function
   peaks at the string's period; its first peak within 7% of the highest one is the pitch, which avoids the
   octave-low and octave-high mistakes, and the peak's height (0–1) says how clear the note is. The mic signal is
   filtered to the guitar's range first (see the Tuner's start). floor is the room's background level. Returns [Hz, clarity, level] or null. */
// Mains hum: in the US, lights, fridges and chargers hum at 120 Hz, which a phone mic picks up about as loud as a
// guitar string at arm's length (David's clips, 2026-11-11). A notch takes it out; the notes near it (A, A♯, B on the
// low strings) lose a little of their lowest tone but keep their overtones, so they still read.
function humNotch(c){const n=c.createBiquadFilter();n.type='notch';n.frequency.value=120;n.Q.value=5;return n;}
function pitchDetect(x,sr,floor){
  const N=x.length;let ss=0;for(let i=0;i<N;i++)ss+=x[i]*x[i];const rms=Math.sqrt(ss/N);
  if(rms<Math.max(.00012,floor*1.4))return [0,0,rms];
  const minT=Math.floor(sr/1050),maxT=Math.min(Math.ceil(sr/62),N>>1),nsdf=new Float32Array(maxT+2);
  let m=2*ss;
  for(let t=0;t<=maxT+1;t++){
    if(t>0)m-=x[t-1]*x[t-1]+x[N-t]*x[N-t];
    let r=0;for(let i=0,L=N-t;i<L;i++)r+=x[i]*x[i+t];
    nsdf[t]=m>0?2*r/m:0;
  }
  // Key maxima: the highest point of each positive stretch after the first negative dip.
  const peaks=[];let t=1;while(t<=maxT&&nsdf[t]>0)t++;
  for(;t<=maxT;t++){
    if(nsdf[t]>0){let best=t;while(t<=maxT&&nsdf[t]>0){if(nsdf[t]>nsdf[best])best=t;t++;}if(best>=minT&&best<maxT)peaks.push(best);}
  }
  if(!peaks.length)return [0,0,rms];
  let top=0;for(const p of peaks)top=Math.max(top,nsdf[p]);
  const p=peaks.find(q=>nsdf[q]>=.93*top);
  const a=nsdf[p-1],b=nsdf[p],c=nsdf[p+1],den=a-2*b+c,shift=den?.5*(a-c)/den:0;
  return [sr/(p+shift),b-.25*(a-c)*shift,rms];
}

function Tuner(){
  const el=h(`<div class="card tuner-live">

    <svg class="gauge" viewBox="0 0 300 244" role="img" aria-label="Tuner needle">

      ${[-50,-25,0,25,50].map(c=>{const a=c/50*60*Math.PI/180;return `<line class="tick" x1="${150+100*Math.sin(a)}" y1="${150-100*Math.cos(a)}" x2="${150+88*Math.sin(a)}" y2="${150-88*Math.cos(a)}"/>`;}).join('')}
      <text class="gl" x="40" y="118">♭ flat</text><text class="gl" x="260" y="118">sharp ♯</text>
      <line class="needle" x1="150" y1="150" x2="150" y2="40"/><circle class="hub" cx="150" cy="150" r="7"/>
      <text class="note" x="150" y="210">–</text><text class="cents" x="150" y="238"></text></svg>
    <div class="feedback tl-msg" aria-live="polite">Listening… pluck one string and let it ring.</div>
    <div class="row"><button type="button" class="btn tl-play" aria-pressed="false" title="Pick a string, then play its pitch">Play pitch</button><span class="cap">Uses your microphone. Nothing is recorded or sent anywhere.</span></div></div>`);
  const needle=el.querySelector('.needle'),gauge=el.querySelector('.gauge'),msg=el.querySelector('.tl-msg'),
        noteT=el.querySelector('.note'),centsT=el.querySelector('.cents'),picks=el.querySelectorAll('.strpick .btn');
  needle.style.transformOrigin='150px 150px';
  const play=el.querySelector('.tl-play');
  let target=0,stream=null,srcNode=null,chain=[],an=null,buf=null,timer=0,running=false;
  let hist=[],shownStr=0,pendStr=0,pendN=0,needleC=0,lastHeard=0,lastF=0,medF=0,noteClar=0,rmsAvg=0,floor=.002,lastMsg='',lastPluck=-9e9,octN=0;
  const say=(t,cls='')=>{if(t+cls===lastMsg)return;lastMsg=t+cls;msg.className='feedback tl-msg '+cls;msg.textContent=t;};
  const setNeedle=(c,dim)=>{needle.style.transform=`rotate(${Math.max(-62,Math.min(62,c/50*60))}deg)`;needle.style.opacity=dim?.35:1;};
  const detect=(x,sr)=>pitchDetect(x,sr,floor);
  const nearest=f=>{let s=1,bd=9;for(let k=1;k<=6;k++){const d=Math.abs(Math.log2(f/STR[k].freq));if(d<bd){bd=d;s=k;}}return s;};
  function show(s,c){
    const ac=Math.abs(c);
    needleC+=(c-needleC)*.35;                 // ease the needle so it doesn't twitch
    noteT.textContent=STR[s].name;noteT.style.fill=STR[s].color;centsT.textContent=`${c>0?'+':''}${Math.round(c)} cents`;
    setNeedle(needleC,false);gauge.classList.toggle('intune',ac<=4);
    picks.forEach(b=>b.classList.toggle('heard',!target&&+b.dataset.s===s));
    if(ac<=4)say(`${STR[s].name} string: in tune.`,'ok');
    else if(c<-100)say(`Way too low for the ${STR[s].name} string. Keep tightening, slowly.`);
    else if(c>100)say(`Way too high for the ${STR[s].name} string. Loosen it well below the note, then tighten up to it.`,'no');
    else if(c<0)say('Too low (flat). Tighten slowly up to the note.');
    else say("Too high (sharp). Loosen until you're below the note, then tighten back up to it.",'no');
  }
  function tick(){
    an.getFloatTimeDomainData(buf);
    const [f0,clar,rms]=detect(buf,AC.sampleRate),now=performance.now();
    // The room's background level: follows the quietest moments, creeping up slowly if the room gets louder.
    floor=rms<floor?rms:Math.min(floor*1.0015,.02);
    let f=f0;
    // While a string is ringing, a slightly less clear reading still counts if it's within 15 cents of the steady
    // reading (so a quiet or fading string keeps reading, but the shaky tail of a fading note can't drag it off);
    // a new note needs a clear reading.
    // A new pluck (a jump in level) starts a fresh note.
    if(rms>rmsAvg*1.8+.0002){noteClar=0;lastPluck=now;lastF=0;octN=0;}
    rmsAvg=rmsAvg*.8+rms*.2;
    // A different note is only taken up just after a pluck. Without this, a steady hum (lights, a fridge) or a string
    // ringing along in sympathy took over the display as the plucked string faded (found with David's iPhone clips).
    const fresh=now-lastPluck<1500;
    // Once the note has settled (not just after a pluck), the same note an octave up or down also agrees: as a string
    // fades, its first overtone often takes over half the readings (the G string in David's clips); fold it back.
    const dc=f&&medF?1200*Math.log2(f/medF):0,oc=fresh?0:Math.round(dc/1200);
    const agrees=f&&medF&&now-lastHeard<600&&Math.abs(oc)<=1&&Math.abs(dc-1200*oc)<15;
    if(agrees&&oc)f/=Math.pow(2,oc);
    if(f&&(agrees||fresh)&&clar>=(agrees?.7:.84)&&f>62&&f<1050){
      // Octave mistakes: with a string picked, fold the reading into that string's octave. On Auto, a jump of
      // exactly one octave from the note just heard is a mistake (no two strings are an octave apart).
      if(target){const r=STR[target].freq;while(f/r>1.5)f/=2;while(r/f>1.5)f*=2;}
      // A jump that lasts (more than two readings in a row) is real, though: before, one octave-low reading at the start of
      // a pluck could lock the whole note an octave low (the B string read as a very sharp A).
      else if(lastF&&now-lastHeard<600){const o=Math.log2(f/lastF);if(Math.abs(Math.abs(o)-1)<.06&&++octN<=2)f=o>0?f/2:f*2;else octN=0;}
      lastF=f;
      // Auto: switch strings only after the new string is heard a few times in a row.
      let s=target;
      if(!s){const n=nearest(f);if(n===shownStr){s=n;pendN=0;}else if(n===pendStr&&++pendN>=(shownStr?3:2)){s=n;pendN=0;hist=[];}else{if(n!==pendStr){pendStr=n;pendN=1;}s=shownStr;}}
      if(!s)return;                                 // the first note shows after two readings agree
      if(s!==shownStr){hist=[];medF=0;noteClar=0;needleC=1200*Math.log2(f/STR[s].freq);}
      shownStr=s;
      const c=1200*Math.log2(f/STR[s].freq);
      // Only readings nearly as clear as this pluck's best move the needle: as a note fades into the room's noise its
      // readings drift, so those just keep the display alive. (The best clarity eases down slowly over time.)
      noteClar=Math.max(clar,noteClar-.002);
      if((Math.abs(c)<600||target)&&(clar>=Math.max(.84,noteClar-.035)||!hist.length)){hist.push(c);if(hist.length>7)hist.shift();}
      const med=[...hist].sort((x,y)=>x-y)[hist.length>>1];
      if(hist.length){lastHeard=now;medF=STR[s].freq*Math.pow(2,med/1200);show(s,med);}
    }else{
      if(now-lastHeard>2200&&lastHeard!==-1){         // hold the last reading a while as the string fades
        lastHeard=-1;hist=[];shownStr=0;pendN=0;lastF=0;medF=0;setNeedle(0,true);gauge.classList.remove('intune');centsT.textContent='';noteT.textContent='–';noteT.style.fill='';
        picks.forEach(b=>b.classList.remove('heard'));say('Listening… pluck one string and let it ring.');
      }else if(lastHeard>0&&now-lastHeard>350)needle.style.opacity=.6;
    }
  }
  let starting=false;
  async function start(){
    if(running||starting)return;starting=true;try{await begin();}finally{starting=false;}
  }
  async function begin(){
    const c=audio();
    if(!c||!navigator.mediaDevices?.getUserMedia){say("This browser can't use the microphone. Try Safari or Chrome.");return;}
    try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}});}
    catch(e){say('The tuner needs the microphone. Allow microphone access for this site in your browser settings, then close the tuner and open it again.');return;}
    if(c.state!=='running')try{await c.resume();}catch(e){}
    // Keep only the guitar's range: cut rumble and hum below the low E and the bright overtones above the high e.
    srcNode=c.createMediaStreamSource(stream);
    const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=60;hp.Q.value=.7;
    const hp2=c.createBiquadFilter();hp2.type='highpass';hp2.frequency.value=60;hp2.Q.value=.7;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;lp.Q.value=.7;
    const hum=humNotch(c);
    an=c.createAnalyser();an.fftSize=4096;buf=new Float32Array(an.fftSize);
    srcNode.connect(hp);hp.connect(hp2);hp2.connect(lp);lp.connect(hum);hum.connect(an);chain=[hp,hp2,lp,hum];
    running=true;lastHeard=-1;hist=[];shownStr=0;lastF=0;medF=0;floor=.001;lastMsg='';
    say('Listening… pluck one string and let it ring.');
    timer=setInterval(tick,45);                      // ~22 readings a second
  }
  function stop(){
    clearInterval(timer);if(srcNode)srcNode.disconnect();chain.forEach(n=>n.disconnect());if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=srcNode=an=null;chain=[];running=false;hist=[];shownStr=0;
    setNeedle(0,true);gauge.classList.remove('intune');picks.forEach(b=>b.classList.remove('heard'));
  }
  // Play pitch: a steady drone on the picked string's note until turned off (a bright-ish sawtooth, softened, so
  // even the low E is clear on phone speakers and beats are easy to hear). Needs a string: greyed out on Auto.
  let pt=null;
  const ring=()=>{const c=audio();if(!c)return;const t=c.currentTime,f=STR[target].freq;
    if(pt){pt.o.frequency.setTargetAtTime(f,t,.02);return;}
    const o=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.value=f;
    lp.type='lowpass';lp.frequency.value=1400;lp.Q.value=.3;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.08);
    o.connect(lp);lp.connect(g);g.connect(OUT);o.start(t);pt={o,g};};
  const quiet=()=>{if(pt&&AC){const t=AC.currentTime;pt.g.gain.cancelScheduledValues(t);pt.g.gain.setTargetAtTime(0,t,.04);pt.o.stop(t+.3);}
    pt=null;play.setAttribute('aria-pressed',false);};
  const playable=()=>{play.disabled=!target;if(!target)quiet();};
  play.onclick=()=>{if(pt)quiet();else{play.setAttribute('aria-pressed',true);ring();}};
  el.querySelector('.strpick').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;target=+b.dataset.s;hist=[];
    picks.forEach(x=>{const on=x===b;x.setAttribute('aria-pressed',on);x.style.background=on&&target?STR[target].color:'';});playable();if(pt)ring();});
  setNeedle(0,true);playable();
  // The tuner listens as soon as it opens, on Auto; closing it (or leaving the app) turns the mic off.
  const auto=()=>{target=0;hist=[];picks.forEach(x=>{x.setAttribute('aria-pressed',x.dataset.s==='0');x.style.background='';});playable();};
  return {el,open:()=>{auto();lastMsg='';say('Listening… pluck one string and let it ring.');start();},
    stop:()=>{quiet();if(running)stop();},resume:()=>start()};
}

// Read-the-tab game: the highlighted tab number is the target. The student plucks it on their guitar and the
// microphone hears it; tapping it on the picture also works, as a backup.
function TabQuiz(seq,{hole=false,lap=false}={}){
  const el=h(`<div class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="row" style="justify-content:space-between"><b>${hole?'Play this string on your guitar':'Play this note on your guitar'}</b><span class="cap tq-n"></span></div>
    <div class="scroll tabbox"></div><div class="fbbox"></div>
    <div class="feedback" aria-live="polite"></div>
    <div class="row"><button type="button" class="btn primary tq-mic"></button><button type="button" class="btn tq-hint">Show me</button><button type="button" class="btn tq-reset">Start over</button></div>
    <p class="cap">The app listens through your microphone and moves on when it hears the right ${hole?'string':'note'}. Nothing is recorded or sent anywhere. Stuck? Tap it on the picture.</p></div>`);
  const fbk=el.querySelector('.feedback'),cnt=el.querySelector('.tq-n'),hint=el.querySelector('.tq-hint');
  let i=0,busy=false;
  const say=(t,cls='')=>{fbk.className='feedback '+cls;fbk.innerHTML=t;};
  const tab=Tab(seq,{badge:true});
  const fb=Fretboard({frets:3,readout:false,orient:false,hole,onTap:(s,f)=>{tap(s,f);return false;}});
  el.querySelector('.tabbox').append(tab.el);el.querySelector('.fbbox').append(fb.el);
  const show=()=>{busy=false;tab.setCur(i);fb.setMarks([]);cnt.textContent=`Note ${i+1} of ${seq.length}`;hint.hidden=false;};
  function right(s,f,delay){
    fb.setMarks([{s,f}]);tab.mark('ok');say(`Yes! ${pill(s)} ${strDesc(s)}, ${f?`fret ${f}`:'open'}.`,'ok');
    i++;busy=true;
    if(i>=seq.length){cnt.textContent='Done';hint.hidden=true;say('You read the whole line of tab. Nice work!','ok');busy=false;mic.stop();}
    else setTimeout(show,delay);
  }
  function tap(s,f){
    if(busy||i>=seq.length)return;
    const [ts,tf]=seq[i].n[0];playNote(s,f);
    if(s===ts&&f===tf)return right(s,f,650);
    fb.flash(s,f);tab.mark('no');
    say(s!==ts?`That's string ${s}. Check which line the number is on: top line is the thinnest string.`
      :`Right string! That's ${f?`fret ${f}`:'open'}. The number in the tab is the fret${tf===0?': 0 means open, no finger down':''}.`,'no');
  }
  const mic=Listener({onNote:m=>{if(busy||i>=seq.length)return;const [ts,tf]=seq[i].n[0],r=judgeNote(m,ts,tf,lap);
      if(r.ok)right(ts,tf,1200);else{tab.mark('no');say(r.t,'no');}},
    onMsg:t=>say(t,'no'),onStop:()=>label()});
  const label=micToggle(mic,el.querySelector('.tq-mic'),{onStart:()=>say('Listening… pluck the highlighted note on your guitar.')});
  hint.onclick=()=>{if(i<seq.length){const [ts,tf]=seq[i].n[0];fb.setMarks([{s:ts,f:tf}]);say('Here it is. Pluck it on your guitar, or tap it here to keep going.');}};
  el.querySelector('.tq-reset').onclick=()=>{i=0;say('');show();};
  show();return el;
}

/* ---------- hearing what the student plays (microphone) ---------- */
const midiOf=(s,f)=>Math.round(69+12*Math.log2(freqOf(s,f)/440));
const where=(s,f)=>`${f?`fret ${f}`:'open'}`;
// Which string and fret (0–4) most likely made a note, to explain a wrong one. Prefers the target string, then
// open strings (the usual slip: the thumb on the string next door), then the target fret.
function whereIs(m,ts,tf){
  const c=[];for(let s=1;s<=6;s++){const f=m-midiOf(s,0);if(f>=0&&f<=4)c.push([s,f]);}
  const rank=([s,f])=>s===ts?0:f===0?1:f===tf?2:3;
  return c.sort((a,b)=>rank(a)-rank(b))[0]||null;
}
// What to say about a played note. The same note an octave away counts as right: the pitch reader can slip an
// octave, and the slips we're listening for (the string next door) are never an octave apart.
function judgeNote(m,ts,tf,lap=false){
  const want=midiOf(ts,tf);
  if(m===want||Math.abs(m-want)===12)return {ok:true,t:`Yes! ${pill(ts)} string ${ts}, ${where(ts,tf)}.${tf?' Same string, both hands.':''}`};
  const w=whereIs(m,ts,tf),again=`string ${ts}, ${where(ts,tf)}`;
  if(!w)return {ok:false,t:`That sounded like ${NOTES[m%12]}, not the note we want. Try again: ${again}.`};
  const [s,f]=w,n=Math.abs(s-ts),move=`${n===1?'one string':`${n} strings`} ${lap?(s>ts?'away from you':'toward you'):`toward ${s>ts?'the floor':'your face'}`}`;
  if(s===ts&&f===0)return {ok:false,t:`That was string ${ts} open. Your thumb found the right string, but no finger was pressing it. Put your finger on string ${ts}, in the middle of fret ${tf}, and press.`};
  if(s===ts)return {ok:false,t:`Right string! That was ${where(s,f)}, though. You want ${tf?`fret ${tf}`:'it open, with no finger down'}.`};
  if(f===0&&tf>0)return {ok:false,t:`That sounded like string ${s} open. Your finger is on string ${ts}, so your thumb needs string ${ts} too. Move your thumb ${move}.`};
  if(f===0)return {ok:false,t:`That sounded like string ${s} open. You want string ${ts}: move your thumb ${move}.`};
  if(f===tf)return {ok:false,t:`That sounded like string ${s}, fret ${f}. Both hands were on the same string, which is great, but it's string ${ts} we want. Move both hands ${move}.`};
  return {ok:false,t:`That sounded like string ${s}, ${where(s,f)}. Try again: ${again}.`};
}
// Listens and calls onNote(midi) once for each plucked note, after its pitch settles. Uses the tuner's pitch
// reader and the same microphone filters. Ignores the app's own sounds (SOUND_UNTIL).
const MICS=new Set();
document.addEventListener('visibilitychange',()=>{if(document.hidden)MICS.forEach(m=>m.stop());});
function Listener({onNote,onMsg,onStop=()=>{}}){
  let stream=null,src=null,chain=[],an=null,buf=null,timer=0,floor=.002,rmsAvg=0,reads=[],armed=true;
  const api={on:false,
    async start(){
      const c=audio();
      if(!c||!navigator.mediaDevices?.getUserMedia){onMsg("This browser can't use the microphone. Try Safari or Chrome.");return false;}
      try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}});}
      catch(e){onMsg('Listening needs the microphone. Allow microphone access for this site in your browser settings, then try again.');return false;}
      if(c.state!=='running')try{await c.resume();}catch(e){}
      src=c.createMediaStreamSource(stream);
      const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=60;hp.Q.value=.7;
      const hp2=c.createBiquadFilter();hp2.type='highpass';hp2.frequency.value=60;hp2.Q.value=.7;
      const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;lp.Q.value=.7;
      const hum=humNotch(c);
      an=c.createAnalyser();an.fftSize=4096;buf=new Float32Array(an.fftSize);
      src.connect(hp);hp.connect(hp2);hp2.connect(lp);lp.connect(hum);hum.connect(an);chain=[hp,hp2,lp,hum];
      floor=.001;reads=[];armed=true;api.on=true;MICS.add(api);timer=setInterval(tick,45);return true;
    },
    stop(){
      if(!api.on)return;clearInterval(timer);if(src)src.disconnect();chain.forEach(n=>n.disconnect());if(stream)stream.getTracks().forEach(t=>t.stop());
      stream=src=an=null;chain=[];api.on=false;MICS.delete(api);onStop();
    }};
  function tick(){
    an.getFloatTimeDomainData(buf);
    const [f,clar,rms]=pitchDetect(buf,AC.sampleRate,floor);
    floor=rms<floor?rms:Math.min(floor*1.0015,.02);
    const plucked=rms>rmsAvg*1.8+.0002;rmsAvg=rmsAvg*.8+rms*.2;
    if(performance.now()<SOUND_UNTIL){reads=[];armed=false;return;}   // the app itself is playing
    if(plucked){armed=true;reads=[];}                                  // a new pluck gets a fresh reading
    if(!armed||!f||clar<.84||f<62||f>1050)return;
    reads.push(69+12*Math.log2(f/440));if(reads.length>4)reads.shift();
    // Four steady readings in a row (within about half a semitone) settle the note.
    if(reads.length===4){const r=[...reads].sort((a,b)=>a-b);if(r[3]-r[0]<.6){armed=false;reads=[];onNote(Math.round((r[1]+r[2])/2));}}
  }
  STOP_ALL.push(()=>api.stop());
  return api;
}
// The Start/Stop listening button shared by the listening exercises.
function micToggle(listener,btn,{onStart=()=>{}}={}){
  const label=()=>{btn.textContent=listener.on?'Stop listening':'Start listening';btn.setAttribute('aria-pressed',listener.on);};
  btn.onclick=async()=>{if(listener.on)listener.stop();else if(await listener.start())onStart();label();};
  label();return label;
}

// A whole guitar seen from the front (headstock left, thinnest string on top): tap a spot on the neck and that
// string lights up all the way to the soundhole, where the thumb plucks it.
function FollowString(){
  const nut=90,neckEnd=470,sy=k=>40+(k-1)*30,hole=640,span=1-Math.pow(2,-4/12);
  const fx=f=>nut+(neckEnd-nut)*(1-Math.pow(2,-f/12))/span,mx=f=>f===0?60:fx(f)-(fx(f)-fx(f-1))*.4;
  let s=`<svg class="fs" viewBox="0 0 820 236" role="img" aria-label="A guitar from the front: tap a spot on the neck to light up its string from your finger to the soundhole">`;
  s+=`<rect class="fs-body" x="492" y="6" width="322" height="224" rx="70"/><circle class="fs-hole" cx="${hole}" cy="${(sy(1)+sy(6))/2}" r="66"/>`;
  s+=`<rect class="fb-board" x="${nut}" y="${sy(1)-14}" width="${neckEnd+40-nut}" height="${sy(6)-sy(1)+28}"/>`;
  for(let f=1;f<=5;f++)s+=`<line class="fb-wire" x1="${fx(f)}" x2="${fx(f)}" y1="${sy(1)-14}" y2="${sy(6)+14}"/>`;
  s+=`<rect class="fb-nut" x="${nut-7}" y="${sy(1)-16}" width="8" height="${sy(6)-sy(1)+32}" rx="2"/><rect class="fs-bridge" x="762" y="${sy(1)-12}" width="14" height="${sy(6)-sy(1)+24}" rx="3"/>`;
  for(let k=1;k<=6;k++)s+=`<line class="fs-str" data-k="${k}" x1="34" x2="769" y1="${sy(k)}" y2="${sy(k)}" stroke-width="${(.9+(k-1)*.5).toFixed(2)}"/>`;
  s+=`<g class="fs-live"></g>`;
  for(let k=1;k<=6;k++)s+=`<circle cx="15" cy="${sy(k)}" r="11" fill="${STR[k].color}"/><text class="fb-lbl" x="15" y="${sy(k)}">${k}</text>`;
  s+=`<text class="fb-num" x="60" y="228">open</text>`;for(let f=1;f<=4;f++)s+=`<text class="fb-num" x="${(fx(f-1)+fx(f))/2}" y="228">${f}</text>`;
  for(let k=1;k<=6;k++)for(let f=0;f<=4;f++){const a=f===0?34:fx(f-1),b=f===0?nut:fx(f);
    s+=`<rect class="fb-hit" data-s="${k}" data-f="${f}" x="${a}" y="${sy(k)-15}" width="${b-a}" height="30"><title>string ${k}, ${where(k,f)}</title></rect>`;}
  s+=`</svg>`;
  const el=h(`<div class="card fsw"><div class="scroll">${s}</div>
    <div class="orient"><span>← headstock</span><span>Thinnest string on top</span><span>soundhole and bridge →</span></div>
    <div class="fb-readout" aria-live="polite"></div>
    <div class="row"><button type="button" class="btn fs-right"></button><button type="button" class="btn fs-wrong"></button></div>
    <p class="cap fs-cap"></p></div>`);
  const live=el.querySelector('.fs-live'),ro=el.querySelector('.fb-readout'),right=el.querySelector('.fs-right'),wrong=el.querySelector('.fs-wrong'),cap=el.querySelector('.fs-cap');
  let cs=4,cf=2;
  const next=()=>cs===6?5:cs+1;   // the string next door (thicker, unless it's already string 6)
  function draw(){
    const y=sy(cs),x=cf?mx(cf):nut,c=STR[cs].color;
    el.querySelectorAll('.fs-str').forEach(l=>l.classList.toggle('dim',+l.dataset.k!==cs));
    live.innerHTML=`<line class="fs-lit" x1="${x}" x2="769" y1="${y}" y2="${y}" stroke="${c}"/>
      ${cf?`<circle cx="${x}" cy="${y}" r="14" fill="${c}"/><text class="fs-in" x="${x}" y="${y}">${cf}</text>`:''}
      <circle class="fs-thumb" cx="${hole}" cy="${y}" r="16" stroke="${c}"/><text class="fs-tl" x="${hole}" y="${y-24}">pluck here</text>`;
    ro.innerHTML=cf?`Finger: ${pill(cs)} string ${cs}, fret ${cf} → thumb: string ${cs}. Same string, both hands.`
      :`Open string: no finger down. Thumb: ${pill(cs)} string ${cs}.`;
    right.innerHTML=`Hear it: thumb on string ${cs}`;
    wrong.innerHTML=`Hear the mistake: thumb on string ${next()}`;
    cap.textContent=cf?`The mistake: your finger is on string ${cs}, but your thumb plucks string ${next()}, so you hear string ${next()} open. Your finger does nothing.`:'';
    wrong.disabled=!cf;
  }
  el.querySelector('svg').addEventListener('click',e=>{const t=e.target.closest('[data-s]');if(!t)return;hush();cs=+t.dataset.s;cf=+t.dataset.f;draw();playNote(cs,cf);});
  right.onclick=()=>{hush();playNote(cs,cf);};
  wrong.onclick=()=>{hush();playNote(next(),0);};
  draw();return el;
}

  if(hole){gt+=`<rect class="sh-wood" x="4" y="22" width="264" height="192" rx="8"/><rect class="fb-board" x="4" y="${y(1)-16}" width="62" height="${y(6)-y(1)+32}"/><line class="fb-wire" x1="34" x2="34" y1="${y(1)-16}" y2="${y(6)+16}"/><circle class="sh-hole" cx="166" cy="${(y(1)+y(6))/2}" r="84"/>`;}
  else{gt+=`<rect class="fb-open" x="4" y="${y(1)-16}" width="40" height="${y(6)-y(1)+32}" rx="6"/><rect class="fb-board" x="50" y="${y(1)-16}" width="250" height="${y(6)-y(1)+32}"/>`;
    [112,170,224,274].forEach(x=>{gt+=`<line class="fb-wire" x1="${x}" x2="${x}" y1="${y(1)-16}" y2="${y(6)+16}"/>`;});
    gt+=`<rect class="fb-nut" x="44" y="${y(1)-18}" width="8" height="${y(6)-y(1)+36}" rx="2"/>`;}
  for(let k=1;k<=6;k++)gt+=`<g data-k="${k}" class="vf-row vf-s" style="transform:translateY(${y(k)}px)"><rect class="vf-hit" x="0" y="-15" width="300" height="30"/><line class="fb-str" x1="4" x2="${hole?268:300}" y1="0" y2="0" stroke-width="${(.9+(k-1)*.5).toFixed(2)}"/><circle cx="${hole?284:22}" cy="0" r="11" fill="${STR[k].color}"/><text class="fb-lbl" x="${hole?284:22}" y="0">${k}</text></g>`;
  gt+=`</svg>`;
  const el=h(`<div class="card vf">
    <div class="vf-panels"><figure><figcaption>Tab</figcaption>${tab}</figure><figure><figcaption class="vf-gcap"></figcaption>${gt}</figure></div>
    <p class="feedback ok">Same order as the tab: string 1 on top, string 6 on the bottom.</p></div>`);
  el.querySelector('.vf-top').textContent='farthest from you';el.querySelector('.vf-bot').textContent='nearest you';el.querySelector('.vf-gcap').textContent='Your guitar, on your lap';
  el.addEventListener('click',e=>{
    const r=e.target.closest('.vf-row');if(!r)return;const k=+r.dataset.k;playNote(k,0);
    el.querySelectorAll(`.vf-row[data-k="${k}"]`).forEach(g=>{g.classList.remove('lit');void g.getBoundingClientRect();g.classList.add('lit');});

// Play the shown note on your own guitar; the microphone checks it was the right string and fret.
// lap: the guitar is flat on the student's lap, so directions are toward / away from you.
function NoteCheck(targets,{lap=false,hole=false,listen='Listening… press, follow, touch, pluck.'}={}){
  const el=h(`<div class="card nc">
    <div class="row" style="justify-content:space-between"><b>Play this note on your guitar</b><span class="cap nc-n"></span></div>
    <div class="nc-target"></div><div class="fbbox"></div>
    <div class="feedback" aria-live="polite"></div>
    <div class="row"><button type="button" class="btn primary nc-mic"></button><button type="button" class="btn nc-hear">Hear it</button><button type="button" class="btn nc-skip">Next note</button></div>
    <p class="cap">Uses your microphone. Nothing is recorded or sent anywhere. Play one note at a time and let it ring.</p></div>`);
  const fbk=el.querySelector('.feedback'),cnt=el.querySelector('.nc-n'),tgt=el.querySelector('.nc-target');
  const fb=Fretboard({frets:4,readout:false,orient:false,hole,onTap:()=>false});
  el.querySelector('.fbbox').append(fb.el);
  let i=0,streak=0,busy=false,lastD=null,sameD=0;
  let tgtT;const say=(t,cls='')=>{fbk.className='feedback '+cls;fbk.innerHTML=t;
    // The target line turns green or red with the verdict; red clears after a moment for another try.
    clearTimeout(tgtT);tgt.className='nc-target '+cls;if(cls==='no')tgtT=setTimeout(()=>tgt.classList.remove('no'),1500);};
  const show=()=>{busy=false;tgt.className='nc-target';const [s,f]=targets[i%targets.length];fb.setMarks([{s,f}]);
    tgt.innerHTML=`${pill(s)} <b>String ${s}, ${f?`fret ${f}`:'open'}</b>`;cnt.textContent=streak?`${streak} in a row`:'';};
  const mic=Listener({onNote:m=>{if(busy)return;const [s,f]=targets[i%targets.length],r=judgeNote(m,s,f,lap);
      if(r.ok){streak++;busy=true;lastD=null;sameD=0;say(r.t,'ok');cnt.textContent=`${streak} in a row`;setTimeout(()=>{i++;show();},1600);}
      else{streak=0;cnt.textContent='';
        // The same small miss (1 or 2 frets' worth) three times running: the guitar may be out of tune.
        const d=m-midiOf(s,f);if(Math.abs(d)>=1&&Math.abs(d)<=2){sameD=d===lastD?sameD+1:1;lastD=d;}else{lastD=null;sameD=0;}
        say(r.t+(sameD>=3?`<span class="nc-tune"><b>Still off by the same amount?</b> If your finger really is on string ${s}, fret ${f}, your guitar may be out of tune. <button type="button" class="btn nc-tuner">Open the tuner</button></span>`:''),'no');}},
    onMsg:t=>{say(t,'no');tgt.className='nc-target';},onStop:()=>label()});
  const label=micToggle(mic,el.querySelector('.nc-mic'),{onStart:()=>say(listen)});
  el.querySelector('.nc-hear').onclick=()=>{const [s,f]=targets[i%targets.length];playNote(s,f,{hold:1.2});};
  el.querySelector('.nc-skip').onclick=()=>{i++;say('');show();};
  fbk.addEventListener('click',e=>{if(!e.target.closest('.nc-tuner'))return;mic.stop();lastD=null;sameD=0;say('');document.getElementById('tuner-open').click();});
  show();return el;
}

/* ---------- tab practice ---------- */
const TAB_LEVELS=[{t:'String 1',s:[1]},{t:'Strings 1–2',s:[1,2]},{t:'Strings 1–3',s:[1,2,3]},{t:'All six',s:[1,2,3,4,5,6]}];
// Random notes on the given strings, frets 0–3, never the same note twice in a row.
function randomNotes(strings,n,prev=null){
  const out=[];let last=prev;
  while(out.length<n){const s=strings[Math.floor(Math.random()*strings.length)],f=Math.floor(Math.random()*4);
    if(last&&last[0]===s&&last[1]===f)continue;out.push([s,f]);last=[s,f];}
  return out;
}
// Endless tab reading, four notes at a time. Play each one on your guitar and the microphone checks it; tapping it
// on the fretboard also works, as a backup.
function TabDrill(){
  const el=h(`<div class="card drill">
    <div class="seg dr-lvl" role="group" aria-label="Which strings">${TAB_LEVELS.map((l,i)=>`<button type="button" class="btn" data-l="${i}">${l.t}</button>`).join('')}</div>
    <div class="row" style="justify-content:space-between"><b class="dr-q"></b><span class="cap dr-n"></span></div>
    <div class="scroll tabbox"></div><div class="fbbox"></div>
    <div class="feedback" aria-live="polite"></div>
    <div class="row"><button type="button" class="btn primary dr-mic"></button><button type="button" class="btn dr-hint">Show me</button></div>
    <p class="cap">The app listens through your microphone. Nothing is recorded or sent anywhere. Stuck? Tap the note on the fretboard.</p></div>`);
  const fbk=el.querySelector('.feedback'),cnt=el.querySelector('.dr-n'),q=el.querySelector('.dr-q'),tabbox=el.querySelector('.tabbox'),micBtn=el.querySelector('.dr-mic');
  let lvl=store.get('drillLevel',0),line=[],i=0,tab=null,streak=0,busy=false;
  const say=(t,cls='')=>{fbk.className='feedback '+cls;fbk.innerHTML=t;};
  const fb=Fretboard({frets:3,readout:false,orient:false,onTap:(s,f)=>{tap(s,f);return false;}});
  el.querySelector('.fbbox').append(fb.el);
  const newLine=()=>{line=randomNotes(TAB_LEVELS[lvl].s,4,line[line.length-1]);i=0;tab=Tab(line.map(([s,f])=>N(s,f)),{badge:true});tabbox.replaceChildren(tab.el);show();};
  const show=()=>{busy=false;tab.setCur(i);fb.setMarks([]);cnt.textContent=streak?`${streak} in a row`:'';};
  const right=(s,f,delay=600)=>{streak++;busy=true;fb.setMarks([{s,f}]);tab.mark('ok');say(`Yes! ${pill(s)} string ${s}, ${where(s,f)}.`,'ok');cnt.textContent=`${streak} in a row`;
    setTimeout(()=>{i++;if(i>=line.length)newLine();else show();},delay);};
  function tap(s,f){
    if(busy)return;const [ts,tf]=line[i];playNote(s,f,{hold:.9});
    if(s===ts&&f===tf)return right(s,f);
    streak=0;cnt.textContent='';fb.flash(s,f);tab.mark('no');
    say(s!==ts?`That's string ${s}. Check which line the number is on: the top line is string 1, the thinnest.`
      :`Right string! That's ${where(s,f)}. The number in the tab is the fret${tf===0?': 0 means open, no finger down':''}.`,'no');
  }
  const mic=Listener({onNote:m=>{if(busy)return;const [ts,tf]=line[i],r=judgeNote(m,ts,tf);
      if(r.ok)right(ts,tf,1200);else{streak=0;cnt.textContent='';tab.mark('no');say(r.t,'no');}},
    onMsg:t=>say(t,'no'),onStop:()=>label()});
  const label=micToggle(mic,micBtn,{onStart:()=>say('Listening… play the highlighted note.')});
  const mark=()=>{el.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.l===lvl));
    q.textContent='Play the highlighted note on your guitar';};
  el.querySelector('.dr-lvl').onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;lvl=+b.dataset.l;store.set('drillLevel',lvl);streak=0;say('');mark();newLine();};
  el.querySelector('.dr-hint').onclick=()=>{const [s,f]=line[i];fb.setMarks([{s,f}]);playNote(s,f,{hold:1.2});say(`Here it is: string ${s}, ${where(s,f)}. Now play it on your guitar.`);};
  mark();newLine();return el;
}
