  <section class="block"><h3>String names</h3><p class="prose">Thicker to thinner: E A D G B e. An easy way to remember the names of the strings is <b>Eddie Ate Dynamite, Good Bye Eddie</b>. Say each name as you pluck that string on your guitar. Tap a letter to hear how it should sound.</p><div data-w="mn"></div></section>
  <section class="block"><h3>Which peg turns which string</h3><p class="prose">On your guitar, trace each string from the bridge, toward the headstock, past the nut, to the post it winds around. That peg is the one.</p><div data-w="hs"></div>
    <div class="callout warn"><b class="t">Common mistake</b><p>Turning the wrong peg. If the string you're plucking doesn't respond, stop. Don't keep cranking; you're tightening a different string.</p></div></section>
  <section class="block"><h3>Using a tuner</h3><ul class="points">
    <li><b>Phone tuner app</b> or <b>clip-on tuner</b>. There are a ton of free guitar tuner apps out there: just search "guitar tuner." I recommend the Fender Tune app. A clip-on attaches to the headstock and feels the vibration directly, so room noise doesn't confuse it.</li>
    <li><b>One string at a time.</b> Other strings ringing will confuse the tuner. For now, hold the guitar however is comfortable and pluck one string with your right thumb.</li>
    <li><b>Keep plucking while you turn.</b> Notes fade quickly. Keep your right thumb plucking while your left hand turns the peg. <b>KEEP PLUCKING!</b></li>
    <li><b>Very out of tune?</b> The tuner may not recognize the note. Get it close by ear (use the letters above) first.</li>
    <li><b>Tune twice.</b> Big adjustments shift the tension on the neck. After all six, go back and check them again.</li></ul>
    <h4 class="subhead">Tune up to the note</h4><p class="prose">Always approach the target pitch from below. If you overshoot and go sharp, loosen until you're below the note, then tighten back up. A string tuned up to pitch holds its tuning better. Practice it here.</p><div data-w="tt"></div>
    <div class="callout tip"><b class="t">This app has a tuner</b><p>When you're ready to tune your guitar for real, tap the <b>Tuner</b> button at the top of any page. Allow the microphone, then pluck one string at a time.</p></div></section>`,
 mount(r){mount(r,'mn',Mnemonic());mount(r,'hs',Headstock());mount(r,'tt',TunerTrainer());}},

{t:'Reading Tab: Right Hand',html:`
  <p class="lead">Tab is the quickest way to start playing real music. Every note in it has an address: which string, which fret, then pluck that same string. You'll start with your right hand: which string to pluck.</p>
  <section class="block"><h3>Guitar on your lap</h3><p class="prose">For this section and the next, lay the guitar flat on your lap. You'll soon see why: lying like this, it looks exactly like the music you'll read.</p>
    <div class="photo-wrap"><figure><svg class="lap-art" viewBox="0 0 900 822" role="img" aria-label="Drawing of a player sitting cross-legged with the guitar on their lap, looking down at it, left hand reaching over the top of the neck"><defs><mask id="gl-lap" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="822"><image href="img/lap-player.png" x="0" y="0" width="900" height="822"/></mask></defs><rect class="g-ink" x="0" y="0" width="900" height="822" mask="url(#gl-lap)"/></svg><figcaption>Guitar on your lap, left hand reaching over the top of the neck.</figcaption></figure>
    <ul class="points">
    <li><b>Face up:</b> strings toward the ceiling, the back of the guitar on your legs.</li>
    <li><b>Neck to your left,</b> headstock pointing left.</li>
    <li><b>Thickest string nearest you,</b> thinnest string farthest away.</li>
    <li><b>Neck drooping?</b> Rest it on a cushion, or lay the guitar on a bed or table instead.</li></ul></div></section>
  <section class="block"><h3>The thumb stroke</h3><p class="prose">For now your right hand does one thing: a stroke with the thumb, from a thicker string toward a thinner one.</p><div data-w="diag"></div><ul class="points">
    <li><b>Where:</b> pluck over the soundhole area.</li>
    <li><b>Anchor:</b> rest your wrist near the bridge. It keeps your hand steady.</li>
    <li><b>How:</b> thumb only, with the fleshy pad of the thumb. Push through the string, moving from the thicker strings toward the thinner ones. On your lap, that's away from you.</li>
    <li><b>How hard:</b> firm enough for a clear tone. No harder.</li></ul>
    <p class="cap">Later, when you sit up with the guitar, this same stroke points down toward the floor.</p></section>
  <section class="block"><h3>Try the stroke</h3><p class="prose">Try it on your guitar: one string at a time, then a slow sweep across all six. The pad below shows the same motion.</p><div data-w="pad"></div></section>

  <section class="block"><span class="eyebrow">Step 1</span><h3>Which string</h3><figure class="vid-wrap"><iframe class="vid" src="https://www.youtube-nocookie.com/embed/pQC3JsbgaTw?start=7&amp;end=55&amp;rel=0&amp;playsinline=1" title="Guitar on the lap: open strings and the lines of tab" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><figcaption>Watch: the guitar on his lap matches the tab, and a 0 appears on each line as he plucks that string. Then try it on your guitar. Video: Good Guitarist on YouTube (needs internet).</figcaption></figure><p class="prose">Tab has six lines, one for each string. With your guitar flat on your lap, neck to the left, the strings line up exactly like the lines of tab. Pluck string 1, then string 6, on your guitar and match each one to its line. Tap a string in the picture to hear it.</p><div data-w="lv"></div>
    <ul class="points"><li><b>Top line:</b> string 1, the thinnest string, farthest from you.</li><li><b>Bottom line:</b> string 6, the thickest string, nearest you.</li><li><b>Tab goes by pitch:</b> the higher the line, the higher the sound.</li></ul>
    <h4 class="subhead">0 means open</h4><p class="prose">For now, every note in the tab is a <b>0</b>. A 0 means an open string: only your right hand plays it. Your left hand's only job is to stay out of the way, off the string being plucked, so it can ring.</p>
    <p class="prose">The highlighted number is your next note. Tap <b>Start listening</b>, then pluck that string on your guitar. Get it right and the tab moves on.</p><div data-w="tq"></div>
    <div class="callout tip"><b class="t">Lost? Count from the thick side</b><p>Put your right thumb on string 6, the thickest one, nearest you. Move away from you one string at a time, counting 6, 5, 4… until you reach the line you want.</p></div>
    <div class="song"><span class="eyebrow">Open strings only</span><h3>Nothing Else Matters · intro</h3><p class="sub">Your first piece. Every note is a 0, so your left hand stays out of the way. Read the lines, and move your thumb from the thicker strings to the thinner ones and back. Press Play to hear it first, then play it on your guitar.</p><div data-w="s"></div></div>
    <p class="prose">That's the right hand's part of the address: which string. Next, your left hand joins in and picks the fret.</p></section>
`,
 mount(r){mount(r,'diag',RightHandDiagram());mount(r,'pad',StrumPad());
   mount(r,'lv',LapView({hole:true}));mount(r,'tq',TabQuiz(SONGS.open,{hole:true,lap:true}));mount(r,'s',Player(SONGS.nem,{frets:3,bpm:55,ring:true,hole:true}));}},

{t:'Reading Tab: Left Hand',html:`
  <p class="lead">Now your left hand joins in. It chooses the fret, the second part of the address. Keep the guitar flat on your lap, neck to the left.</p>

  <section class="block"><span class="eyebrow">Step 2</span><h3>Which fret</h3><figure class="vid-wrap"><iframe class="vid" src="https://www.youtube-nocookie.com/embed/pQC3JsbgaTw?start=58&amp;end=136&amp;rel=0&amp;playsinline=1" title="Counting frets up the thinnest string" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><figcaption>Watch: he counts up the frets on the thinnest string, then shows the dots that help you find your place. Then try it on your guitar. Video: Good Guitarist on YouTube (needs internet).</figcaption></figure><p class="prose">The second part of the address is the fret: the number on the line. A 3 on the top line is the address <b>string 1, fret 3</b>. A 2 on the bottom line is <b>string 6, fret 2</b>.</p>
    <ul class="points">
      <li><b>A fret is a space,</b> the area between two metal wires, not a wire. Fret 2 is the space between the 1st and 2nd wires.</li>
      <li><b>Count from the nut.</b> The nut is fret 0, the open string. Fret 1 is the first space after it, toward the body.</li>
      <li><b>Higher numbers</b> are toward the body and higher in pitch.</li></ul>
    <h4 class="subhead">How hard to press</h4><p class="prose">Clear tone means enough. Buzzing means press more. Tired hand means too much.</p><div data-w="pr"></div></section>

  <section class="block"><span class="eyebrow">Step 3</span><h3>Pluck that same string</h3><p class="prose">Your left hand chooses the note. Your right hand has to pluck that same string, or your finger does nothing at all. Each string runs all the way from the headstock to the bridge: your finger presses it near one end, and your thumb plucks it over the soundhole. On your guitar, put a finger on a string and follow that string with your eyes to the soundhole. Not sure? Tap a spot on the neck in the picture to light up its string.</p><div data-w="fs"></div>
    <h4 class="subhead">Press, follow, touch, pluck</h4><ul class="points">
      <li><b>Press.</b> Put your left finger on the address and say it out loud: "string 4, fret 2."</li>
      <li><b>Follow.</b> Trace that string with your eyes, from your fingertip to the soundhole.</li>
      <li><b>Touch.</b> Rest your right thumb on that string before you play. You can feel it's the right one.</li>
      <li><b>Pluck.</b> Push through it, away from you, with the same thumb stroke you've been using.</li></ul>
    <h4 class="subhead">Check it with the microphone</h4><p class="prose">Play each address on your guitar. The app listens and tells you if you got it. If you plucked the wrong string, it tells you which way to move your thumb.</p><div data-w="nc"></div></section>

  <section class="block"><span class="eyebrow">Put it together</span><h3>Follow the tab</h3><p class="prose">Press Play and play along on your guitar. It starts with a few notes on the thinnest string, then adds more strings as it goes.</p><div data-w="zig"></div>
    <h4 class="subhead">Check in</h4><p class="prose">Read tab from left to right, like a sentence: each number is the next note to play. Left to right tells you <b>when</b>. The line and the number tell you <b>where</b>.</p><p class="prose">This is the idea most likely to get tangled. Make sure it's solid before moving on. Next, you'll sit up with the guitar.</p><div data-w="q"></div></section>`,
 mount(r){mount(r,'pr',Pressure());
   mount(r,'fs',FollowString());mount(r,'nc',NoteCheck([[4,2],[3,2],[5,2],[2,1],[3,1],[4,3],[2,3],[5,3],[1,1],[3,2],[6,3],[1,3],[4,1],[2,2],[5,1],[6,2]],{lap:true,listen:'Listening… string, fret, pluck.'}));
   mount(r,'zig',Player(SONGS.zig,{frets:3,bpm:40}));mount(r,'q',TermQuiz([
   {q:'In tab, a number further to the right means…',o:['play it later','play it closer to the body'],a:0,why:'Yes. Left to right is the order in time.',no:'That\'s the trap. Position on the neck comes only from the number.'},
   {q:'The top line of tab is…',o:['the thickest string','the thinnest string'],a:1,why:'Right. Top line, thinnest string.'},
   {q:'A 0 on the bottom line means…',o:['rest, don\'t play','pluck the thickest string open'],a:1,why:'Yes. 0 is the nut: no finger down, but you still pluck.'}]));}},

{t:'Pick It Up',html:`
  <p class="lead">Time to sit up with the guitar, the way you'll play from now on. Everything you learned on your lap still works. Only your view changes.</p>
  <section class="block"><div class="photo-wrap"><figure><img src="${'{{IMG.hold}}'}" alt="Seated player holding an acoustic guitar on the right leg with the right forearm over the body"><figcaption>Seated, guitar on the right leg.</figcaption></figure>
    <div class="annot"><div><b>Right leg</b><span>The guitar's waist rests on your right leg (for right-handed players).</span></div>
      <div><b>Right forearm</b><span>Rests over the top edge of the body. Arm and leg hold the guitar together.</span></div>
      <div><b>Left hand</b><span>Bears zero weight. You should be able to take it off the neck completely and the guitar stays put.</span></div></div></div></section>
  <section class="block"><h3>Small things that matter</h3><ul class="points">
    <li><b>Keep the guitar upright.</b> Don't tilt it toward you to see your hands. Tilting bends your left wrist, and every tendon to your fingers runs through it. Worth avoiding from the start.</li>
    <li><b>Sit reasonably upright.</b> Resist the urge to hunch.</li>
    <li><b>Looking at your fingers is fine.</b> You'll need to lean your head forward to check where your fingers are going, especially at first. Keep it to a minimum and move your head, not the guitar.</li></ul></section>
  <section class="block"><div class="photo-wrap"><figure><img src="${'{{IMG.mistake}}'}" alt="Player tilting the guitar up toward himself, with the left wrist bent sharply"><figcaption>Common mistake: guitar tilted up, left wrist bent.</figcaption></figure>
    <div class="callout warn"><b class="t">Common mistake</b><p>Pointing the guitar up so you can see the fingerboard. It feels helpful, but it bends your left wrist into a strained angle and makes every note harder.</p></div></div></section>
  <section class="block"><h3>Left hand shape</h3><p class="prose">On your lap, your pointer finger reached over the neck. Now your hand comes up from underneath.</p><ul class="points"><li>Thumb behind the neck, roughly behind your middle finger.</li><li>Fingers curved, coming down perpendicular to the fingerboard.</li><li>Leave a little space between your palm and the underside of the neck. Your hand shouldn't squeeze or rest against the neck.</li></ul>
    <figure class="lh-photo"><img src="img/fret-space.webp" alt="Close-up of two fingertips pressing strings, fingers arched tall and coming straight down onto the fingerboard" loading="lazy"><figcaption>Keep your fingers as tall as you can, coming straight down onto the fingerboard. Standing them up like this keeps them from touching the strings next to them.</figcaption></figure>
    <figure class="lh-photo"><img src="img/palm-gap.webp" alt="Left hand fretting the guitar, with a red arrow showing the gap between the palm and the underside of the neck" loading="lazy"><figcaption>The red arrow shows the gap between your palm and the neck. Keep that space open.</figcaption></figure>
</section>
  <div class="callout tip"><b class="t">Lost? Two ways back</b><p><b>Count with your right thumb:</b> put it on string 6, nearest your face, and count 6, 5, 4… until you reach the string you want. <b>Or do a lap check:</b> lay the guitar back on your lap, where it looks just like the tab. Find the note there, then sit back up and play it.</p></div>
  <div class="callout calm"><b class="t">Stay relaxed</b><p>You'll see this all through the course. Tension works against technique in almost every way. If something hurts or feels like a fight, stop, shake out your hands, and loosen up before trying again.</p></div>
  <section class="block"><h3>Play it sitting up</h3><p class="prose">Same addresses, now sitting up. Your thumb stroke still goes from the thicker strings toward the thinner ones, which now means down toward the floor. If you miss, the app tells you which way to move your thumb: toward your face or toward the floor.</p><div data-w="nc"></div></section>
  <section class="block"><h3>Posture check</h3><p class="prose">Run through this each time you pick up the guitar.</p><div data-w="ck"></div></section>`,
 mount(r){mount(r,'nc',NoteCheck([[4,2],[3,2],[5,2],[2,1],[3,1],[4,3],[2,3],[5,3],[1,1],[3,2],[6,3],[1,3],[4,1],[2,2],[5,1],[6,2]]));mount(r,'ck',Checklist(['Guitar\'s waist on my right leg','Right forearm resting over the top of the body','I can let go with my left hand and the guitar stays put','Guitar upright, not tilted toward me','Shoulders loose, not hunched'],'posture'));}},

{t:'Tab Practice',html:`
  <p class="lead">Reading tab gets easy with lots of short practice. Come back to this page any time, for as long or as short as you like.</p>
  <section class="block"><h3>Read it: tab to fretboard</h3><p class="prose">Four notes at a time, as many as you want. Start with one string and add more when it feels easy. Tap <b>Start listening</b> and play each note on your guitar: the microphone checks you.</p><div data-w="dr"></div>
    <div class="callout tip"><b class="t">Lost? Lap check</b><p>Lay the guitar on your lap: it matches the tab.</p></div></section>
  <section class="block"><h3>Play along</h3><p class="prose">Press Play, listen to the four clicks, and play each note on your guitar as it lights up. Start at Very slow. When you can play it all the way through without stopping, try the next speed.</p>
    <div class="callout tip"><b class="t">Keep going</b><p>Made a mistake? Don't stop: skip to the next note in time with the music. Staying with the beat matters more than getting every note.</p></div>
    <div class="song"><span class="eyebrow">Strings 1 and 2</span><h3>Back and forth</h3><div data-w="pa1"></div></div>
    <div class="song"><span class="eyebrow">Strings 1, 2 and 3</span><h3>Three strings</h3><div data-w="pa2"></div></div></section>`,
 mount(r){mount(r,'dr',TabDrill());mount(r,'pa1',Player(SONGS.pa1,{frets:3,bpm:40,count:4}));mount(r,'pa2',Player(SONGS.pa2,{frets:3,bpm:40,count:4}));}},

{t:'Your First Songs',html:`
  <p class="lead">Songs to play on your guitar: a famous riff to start, then one finger per fret, tunes you already know, and riffs further up the neck. Press Play and play along, starting at Very slow.</p>
  <div class="song"><span class="eyebrow">Two strings</span><h3>Seven Nation Army</h3><p class="sub">The whole riff uses just two strings, string 4 and string 5. It starts on open string 4. Tap Start listening to play it at your own pace while the app checks each note.</p><div data-w="s1"></div></div>
  <section class="block"><span class="eyebrow">Part 2</span><h3>One finger per fret</h3>
    <p class="prose">Give each finger its own fret: <b>finger 1</b> (index) on fret 1, <b>finger 2</b> (middle) on fret 2, <b>finger 3</b> (ring) on fret 3. A 0 means no finger. Your hand stays in one place and every note is ready. Going up, leave each finger down as the next one lands; coming back, lift one at a time.</p>
    <figure class="lh-photo"><img src="${'{{IMG.hands}}'}" alt="Finger numbers: left hand fingers 1 to 4 plus thumb; right hand p i m a"><figcaption>Left-hand fingers are 1–4, index to pinky. Your thumb stays behind the neck.</figcaption></figure>
    <div class="song"><span class="eyebrow">String 1</span><h3>Up and back</h3><div data-w="f1"></div></div>
    <div class="song"><span class="eyebrow">Strings 2 and 1</span><h3>Crossing over</h3><p class="sub">Your hand doesn't move; only your fingers do.</p><div data-w="f2"></div></div>
    <div class="song"><span class="eyebrow">Every string</span><h3>All the way across</h3><p class="sub">String 6 to string 1. Press, follow, touch, pluck on every string.</p><div data-w="f3"></div></div></section>
  <section class="block"><span class="eyebrow">Part 3</span><h3>Melodies</h3>  <p class="prose">Tunes you already know, written in tab. When you know how a tune goes, you can hear your own mistakes.</p>
  <p class="prose">Use one finger per fret, like you just practiced. Play along on your guitar, starting at Very slow.</p>
  <div class="song"><span class="eyebrow">Strings 1 and 2</span><h3>Mary Had a Little Lamb</h3><div data-w="m1"></div></div>
  <div class="song"><span class="eyebrow">Strings 1 and 2</span><h3>Ode to Joy</h3><p class="sub">Beethoven's tune. Same notes as Mary, plus fret 1 on string 1.</p><div data-w="m2"></div></div>
  <div class="song"><span class="eyebrow">Strings 1, 2 and 3</span><h3>Twinkle, Twinkle, Little Star</h3><p class="sub">String 3 joins in. Its 2nd fret is finger 2.</p><div data-w="m3"></div></div>
  <div class="song"><span class="eyebrow">Strings 1, 2 and 3</span><h3>Happy Birthday</h3><p class="sub">Three beats to a bar, so the count-in is 1, 2, 3. The tune starts with two quick notes.</p><div data-w="m4"></div></div></section>
  <section class="block"><span class="eyebrow">Part 4</span><h3>Riffs</h3>  <p class="prose">A riff is a short pattern that a song keeps coming back to. Seven Nation Army is one. These go further up the neck, past fret 3.</p>
  <p class="prose">Counting past fret 3: keep counting the spaces from the nut, 4, 5, 6. Most guitars have a dot at fret 5. If yours also has one at fret 3, fret 5 is the second dot. Fret 6 is the space right after fret 5.</p>
  <div class="song"><span class="eyebrow">String 6 only</span><h3>Peter Gunn</h3><p class="sub">All on the thickest string. Try finger 1 for fret 2, finger 2 for fret 3, and finger 4, your pinky, for fret 5.</p><div data-w="r1"></div></div>
  <div class="song"><span class="eyebrow">String 4 only</span><h3>Smoke on the Water</h3><p class="sub">All on string 4. Try finger 1 for fret 3, finger 3 for fret 5, and finger 4 for fret 6.</p><div data-w="r2"></div></div></section>`,
 mount(r){mount(r,'s1',Player(SONGS.sna,{frets:3,bpm:95,listen:true}));
   mount(r,'f1',Player(SONGS.ff1,{frets:3,bpm:55,count:4,finger:true}));mount(r,'f2',Player(SONGS.ff2,{frets:3,bpm:55,count:4,finger:true}));mount(r,'f3',Player(SONGS.ff3,{frets:3,bpm:55,count:3,finger:true}));
   const o={frets:3,bpm:55,count:4,finger:true};
   mount(r,'m1',Player(SONGS.mary,o));mount(r,'m2',Player(SONGS.ode,o));mount(r,'m3',Player(SONGS.twinkle,o));mount(r,'m4',Player(SONGS.bday,{...o,count:3}));
   mount(r,'r1',Player(SONGS.gunn,{frets:7,bpm:55,count:4}));mount(r,'r2',Player(SONGS.smoke,{frets:7,bpm:55,count:4}));}},

{t:'Two Notes at Once',html:`
  <p class="lead">Stacked numbers in tab mean "play these strings together." Two notes together on the thick strings is the sound of a lot of rock music.</p>
  <section class="block"><h3>One shape, three places</h3><ul class="points">
    <li>One open string, plus <b>finger 1</b> on the next thinner string at the 2nd fret.</li>
    <li>Sweep your thumb across <b>just those two strings</b> and let it land on the next string. Landing there stops that string from ringing.</li>
    <li>Same shape on strings 6 and 5, then 5 and 4, then 4 and 3. Only your hand moves.</li></ul>
    <p class="cap">These are called power chords. E5 is said "E five."</p></section>
  <section class="block"><div class="song"><span class="eyebrow">Moving the shape</span><h3>E5, A5, D5</h3><p class="sub">Four strokes each, then change. Look at the tab for your next pair of strings before you get there.</p><div data-w="p1"></div></div></section>
  <section class="block"><div class="song"><span class="eyebrow">Rock rhythm</span><h3>Chug and change</h3><p class="sub">Four quick, short strokes on E5, then change for two longer ones. Short notes stop as soon as the next one starts.</p><div data-w="p2"></div></div></section>`,
 mount(r){mount(r,'p1',Player(SONGS.pc1,{frets:3,bpm:55,count:4}));mount(r,'p2',Player(SONGS.pc2,{frets:3,bpm:55,count:4}));}},

{t:'Chord Diagrams',html:`
  <p class="lead">Three short pieces. Each one adds a single new idea, and the last one turns out to be your first chord.</p>
  <div class="song"><span class="eyebrow">Open strings, crossing strings</span><h3>Nothing Else Matters · intro</h3><p class="sub">You played this on your lap in Reading Tab: Right Hand. Now play it sitting up. No left-hand fingers: move your thumb from thicker strings to thinner ones and back.</p><div data-w="s2"></div></div>
  <div class="song"><span class="eyebrow">Two fingers</span><h3>Same motion, two fingers down</h3><p class="sub">Put your middle finger on string 5, 2nd fret, and your ring finger on string 4, 2nd fret. Leave both fingers down the whole time, even while you play the other strings. Play thickest to thinnest, one note at a time.</p><div data-w="s3"></div></div>
  <div class="song"><span class="eyebrow">All six at once</span><h3>One sweep of the thumb</h3><p class="sub">Same two fingers, same strings. Now sweep your thumb across all six in one motion. Stacked numbers in tab mean "play these together."</p><div data-w="s4"></div></div>
  <section class="block"><div class="big-idea"><span class="eyebrow">Reveal</span><h3>You just played an Em chord!</h3>
    <p class="prose">Here's a map of what your fingers were doing. A chord diagram is a picture of the neck standing up: headstock at the top, thicker strings on the left.</p>
    <div class="chords"><div data-w="emr"></div><ul class="points" style="flex:1;min-width:220px"><li>Circle above a string: play it open.</li><li>Dot: put a finger here.</li><li>Middle finger on string 5, ring finger on string 4, both at the 2nd fret. Exactly what you just did.</li></ul></div></div></section>  <section class="block"><h3>Reading a diagram</h3><p class="prose">Tab and chord diagrams show the same notes two different ways. Tab is the order in time. A chord diagram is a snapshot of your hand at a given moment.</p><ul class="points">
    <li>Headstock at the top; the thick bar is the nut.</li>
    <li>Thicker strings on the left, thinner on the right.</li>
    <li>Circle: play open. ✕: don't strum that string. Number in a dot: which finger.</li></ul>
    <figure class="lh-photo"><img src="${'{{IMG.hands}}'}" alt="Finger numbers: left hand fingers 1 to 4 plus thumb; right hand p i m a"><figcaption>Finger numbers. Left-hand fingers are 1–4 from index to pinky.</figcaption></figure>

<div class="update" id="update-banner" role="status" hidden><span>A new version is ready.</span><button type="button" class="btn primary" id="update-btn">Update</button></div>
<script>
// Offline support + updates. See sw.js.
// The version shown in Settings. tools/bump.sh keeps this in step with VERSION in sw.js.
window.APP_VERSION = 'v73';
(async () => {
  if (!('serviceWorker' in navigator)) return;
  const reg = await navigator.serviceWorker.register('sw.js');
  window.SW_REG = reg;
  const banner = document.getElementById('update-banner');
  const hadController = Boolean(navigator.serviceWorker.controller);
  const apply = (worker) => worker.postMessage('skipWaiting');
  // Right after the app opens there's nothing to lose, so updates apply on their own.
  // Later on, offer a banner instead of reloading in the middle of a lesson.
  const justOpened = () => performance.now() < 20000;
  const handle = (worker) => {
    if (!worker || !navigator.serviceWorker.controller) return;
    if (justOpened()) apply(worker);
    else {
      banner.hidden = false;
      document.getElementById('update-btn').onclick = () => apply(worker);
    }
  };
  const watch = (worker) => {
    if (!worker) return;
    if (worker.state === 'installed') return handle(worker);
    worker.addEventListener('statechange', () => { if (worker.state === 'installed') handle(worker); });
  };
  handle(reg.waiting);
  watch(reg.installing);
  reg.addEventListener('updatefound', () => watch(reg.installing));
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  // Check now, and again whenever the Home Screen app comes back to the front.
  // iPhones can finish downloading an update while the app is in the background,
  // so look for a waiting update after each check too.
  const check = () => { if (navigator.onLine) reg.update().catch(() => {}).then(() => handle(reg.waiting)); };
  check();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
})();
</script>
