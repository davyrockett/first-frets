<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beginner Guitar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guitar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151310" media="(prefers-color-scheme: dark)">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.update{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:15px;max-width:calc(100% - 32px)}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: lesson rail on the left, one lesson at a time in a reading column; every diagram is something you can tap and hear. */
:root{
  --bg:#F1F0EC; --surface:#FFFFFF; --sunk:#E7E5DF; --ink:#1E1B18; --muted:#635D55; --line:#D8D4CC;
  --accent:#D47B22; --accent-ink:#8C4A0A; --accent-soft:#F6E3CC;
  --good:#2E7D4F; --good-soft:#DDEFE3; --bad:#B23A28; --bad-soft:#F6DED8;
  --wood:#D9A86C; --wood-edge:#A9733A; --board:#3B2B22; --wire:#C8C2B8; --nut:#EFE6D2; --metal:#B9B2A6; --hole:#2A1D16;
  --f-display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px; --hl:#1668E3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151310; --surface:#201C18; --sunk:#2A2520; --ink:#F0EBE3; --muted:#A79E92; --line:#3B342D;
  --accent:#EE9A45; --accent-ink:#F5BE85; --accent-soft:#3B2A19;
  --good:#5DBB84; --good-soft:#1E3427; --bad:#E5735F; --bad-soft:#3D221D;
  --wood:#B88550; --wood-edge:#8A5C2E; --board:#0F0B09; --wire:#8F887E; --nut:#D8CFBB; --metal:#9C958A; --hole:#0A0705; --hl:#3D8BFF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151310; --surface:#201C18; --sunk:#2A2520; --ink:#F0EBE3; --muted:#A79E92; --line:#3B342D;
  --accent:#EE9A45; --accent-ink:#F5BE85; --accent-soft:#3B2A19;
  --good:#5DBB84; --good-soft:#1E3427; --bad:#E5735F; --bad-soft:#3D221D;
  --wood:#B88550; --wood-edge:#8A5C2E; --board:#0F0B09; --wire:#8F887E; --nut:#D8CFBB; --metal:#9C958A; --hole:#0A0705; --hl:#3D8BFF;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:.01em;line-height:1.02;text-wrap:balance;margin:0}
p{margin:0}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:22px}
.brand h1{font-size:44px;text-transform:uppercase}
.brand p{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.prog{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.prog .bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.nav{display:flex;flex-direction:column;gap:2px;list-style:none;margin:0;padding:0}
.nav button{display:grid;grid-template-columns:28px 1fr 18px;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1.25}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav .n{font-family:var(--f-display);font-size:20px;font-weight:800;color:var(--muted)}
.nav button[aria-current="true"] .n{color:var(--accent-ink)}
.nav .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line)}
.nav .ck.done{background:var(--good);border-color:var(--good);position:relative}
.nav .ck.done::after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg)}
main{padding-inline:clamp(16px,4vw,56px);padding-block:40px 80px;min-width:0}
.lesson{max-width:780px;display:flex;flex-direction:column;gap:34px}
.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.lesson>header{display:flex;flex-direction:column;gap:10px}
.lesson>header h2{font-size:clamp(48px,7vw,76px);text-transform:uppercase}
.lead{font-size:20px;color:var(--muted);max-width:62ch}
section.block{display:flex;flex-direction:column;gap:14px}
section.block>h3{font-size:30px;text-transform:uppercase}
.prose{display:flex;flex-direction:column;gap:12px;max-width:65ch}
p.prose{display:block}
ul.points{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px;max-width:65ch}
ul.points li::marker{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.callout{border-radius:var(--r);padding:14px 18px;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.callout b.t{font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.callout.warn{background:var(--bad-soft)}
.callout.warn b.t{color:var(--bad)}
.callout.tip{background:var(--accent-soft)}
.callout.tip b.t{color:var(--accent-ink)}
.callout.calm{background:var(--good-soft)}
.callout.calm b.t{color:var(--good)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cap{font-size:13px;color:var(--muted)}
.btn{border:1.5px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px;line-height:1.2;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1E1B18}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.feedback{min-height:1.55em;font-weight:700}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.twocol>*{min-width:0}
.pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:24px;flex-wrap:wrap}
.pager .btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 16px}
.pager .btn small{font-weight:400;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.pager .next{margin-left:auto;align-items:flex-end}
.chn{text-transform:none}
h4.subhead{font-family:var(--f-display);font-size:24px;text-transform:uppercase;margin:12px 0 0}
.fpop{font:inherit;color:var(--accent-ink);background:var(--accent-soft);border:0;border-bottom:2px dotted var(--accent);border-radius:4px;padding:0 4px;cursor:pointer}
.fpop-card{position:absolute;z-index:30;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.fpop-img{width:100%;aspect-ratio:300/344;overflow:hidden;border-radius:8px;background:#fff}
.fpop-img img{width:200%;max-width:none;display:block}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;padding:0 .4em;border-radius:99px;font-weight:700;font-size:.85em;color:#1E1B18;vertical-align:.08em}
/* svg pieces */
svg text{font-family:var(--f-body)}
.fb{display:block;width:100%;height:auto;touch-action:manipulation}
.fb-open{fill:var(--sunk)}
.fb-board{fill:var(--board)}
.fb-wire{stroke:var(--wire);stroke-width:3}
.fb-nut{fill:var(--nut)}
.fb-dot{fill:var(--nut);opacity:.85}
.fb-str{stroke:var(--metal)}
.fb-num{fill:var(--muted);font-size:13px;text-anchor:middle;font-variant-numeric:tabular-nums}
.fb-lbl{font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#1E1B18}
.fb-hit{fill:transparent;cursor:pointer}
.fb-hit:hover{fill:rgba(255,255,255,.08)}
.fb-mark text{font-size:16px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#1E1B18;pointer-events:none}
.fb-mark circle{pointer-events:none}
.fb-mark .dot{stroke:#fff;stroke-width:2.5;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
.fb-mark .halo{opacity:0;transform-box:fill-box;transform-origin:center}
.fb-mark.pop{animation:pop .25s ease-out}
.fb-mark.pop .halo{animation:halo .7s ease-out}
@keyframes halo{from{transform:scale(1);opacity:.75}to{transform:scale(2.1);opacity:0}}
@keyframes pop{from{transform:scale(.5);opacity:.3}to{transform:scale(1);opacity:1}}
.fb-mark{transform-box:fill-box;transform-origin:center}
.orient{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.fb-readout{font-family:var(--f-mono);font-size:14px;color:var(--muted);min-height:1.4em}
.tab{display:block;min-width:100%}
.tab line.l{stroke:var(--muted);stroke-width:1;opacity:.55}
.tab line.bar{stroke:var(--muted);stroke-width:1.5;opacity:.7}
.tab .tl{font-family:var(--f-mono);font-size:13px;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.tab .tn{font-family:var(--f-mono);font-size:16px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.tab .tb{fill:var(--surface)}
.tab .cur{fill:var(--accent-soft);opacity:0;transition:opacity .1s}
.tab .cur.on{opacity:1}
.tab .col{cursor:pointer}
.tab .ch{font-family:var(--f-display);font-weight:800;font-size:20px;fill:var(--accent-ink)}
.player{display:flex;flex-direction:column;gap:12px}
.player .tabbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 4px}
.player select{font:inherit;font-size:15px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.song{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.song h3{font-size:30px;text-transform:uppercase}
.song .sub{color:var(--muted)}
.chord{width:170px;flex:none}
.chord .grid line{stroke:var(--muted)}
.chord .nutbar{fill:var(--ink)}
.chord .dot{fill:var(--ink)}
.chord .fn{fill:var(--surface);font-size:14px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.chord .om{fill:none;stroke:var(--ink);stroke-width:2}
.chord .xm{stroke:var(--ink);stroke-width:2.2}
.chord .sn{font-size:13px;font-weight:700;text-anchor:middle}
.chord .lab{font-size:11px;fill:var(--muted);text-anchor:middle;letter-spacing:.08em;text-transform:uppercase}
.chord .name{font-family:var(--f-display);font-weight:800;font-size:30px;fill:var(--ink);text-anchor:middle}
.chords{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.chordcard{display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 14px;cursor:pointer}
.chordcard:hover{border-color:var(--accent)}
.anat{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:24px;align-items:start}
.anat svg{width:100%;max-width:280px;height:auto;display:block;margin:0 auto}
.anat .hit{fill:transparent;cursor:pointer}
.anat .hl{fill:var(--hl);fill-opacity:.22;stroke:var(--hl);stroke-width:3.5;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none;opacity:0;transition:opacity .15s;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff)}
.anat .hl *{vector-effect:non-scaling-stroke}
.anat figure{gap:6px}
.credit{font-size:11px;text-align:center}
.an-fret{fill:var(--muted);font-size:26px;font-weight:700;dominant-baseline:central}
.an-lbl{fill:#1E1B18;font-size:24px;font-weight:700}
.an-num{fill:#1E1B18;font-size:18px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.credit a{color:inherit}
.anat .hl.on{opacity:1}
.parts{display:flex;flex-wrap:wrap;gap:6px}
.parts .btn{font-size:14px;padding:7px 11px}
.partinfo{display:flex;flex-direction:column;gap:6px}
.partinfo h4{font-family:var(--f-display);font-size:28px;text-transform:uppercase;margin:0}
.body-wood{fill:var(--wood)} .body-edge{fill:var(--wood-edge)} .hole{fill:var(--hole)} .ros{fill:none;stroke:var(--wood-edge);stroke-width:3}
.hs-wood{fill:var(--board)} .peg{fill:var(--metal)} .post{fill:var(--nut)}
.bridge{fill:var(--board)} .metal{stroke:var(--metal)}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.term h4{font-family:var(--f-display);font-size:26px;text-transform:uppercase;margin:0}
.term .say{font-size:14px;display:flex;flex-direction:column;gap:2px}
.term .say .y{color:var(--good);font-weight:700}
.term .say .n{color:var(--bad);font-weight:700;text-decoration:line-through;text-decoration-thickness:1.5px}
.qz{display:flex;flex-direction:column;gap:10px}
.qitem{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.qitem:first-child{border-top:0;padding-top:0}
.qitem .btn.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.qitem .btn.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
figure{margin:0;display:flex;flex-direction:column;gap:8px}
figure img{border-radius:var(--r);background:#fff;display:block}
figcaption{font-size:14px;color:var(--muted)}
.photo-wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.annot{display:flex;flex-direction:column;gap:12px}
.annot div{display:flex;flex-direction:column;gap:2px}
.annot b{font-family:var(--f-display);font-size:22px;text-transform:uppercase}
.check{display:flex;flex-direction:column;gap:6px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--good);flex:none;margin-top:2px}
.check label:has(input:checked){border-color:var(--good);background:var(--good-soft)}
.mnemo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.mnemo div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:8px;background:var(--surface);border:1px solid var(--line);cursor:pointer;min-width:0}
.mnemo .L{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1}
.mnemo .w{font-size:13px;color:var(--muted);text-align:center}
.mnemo .num{font-size:12px;color:var(--muted)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pad{position:relative;height:230px;background:var(--wood);border-radius:var(--r);touch-action:none;cursor:pointer;overflow:hidden;user-select:none;-webkit-user-select:none}
.pad .hole{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;background:var(--hole);box-shadow:0 0 0 8px var(--wood-edge)}
.pad .s{position:absolute;left:0;right:0;height:0;border-top:solid var(--metal);transition:transform .05s}
.pad .s.v{animation:vib .35s linear}
@keyframes vib{0%,100%{transform:translateY(0)}20%{transform:translateY(2px)}40%{transform:translateY(-2px)}60%{transform:translateY(1.5px)}80%{transform:translateY(-1px)}}
.pad .sl{position:absolute;left:8px;font-size:12px;font-weight:700;color:#1E1B18;transform:translateY(-50%);border-radius:99px;padding:0 6px}
.tuner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}
.gauge{width:100%;max-width:340px;display:block;margin:0 auto}
.gauge .arc{fill:none;stroke:var(--line);stroke-width:14;stroke-linecap:round}
.gauge .zone{fill:none;stroke:var(--good);stroke-width:14}
.gauge .tick{stroke:var(--muted);stroke-width:2}
.gauge .needle{stroke:var(--ink);stroke-width:4;stroke-linecap:round;transition:transform .12s linear}
.gauge .hub{fill:var(--ink)}
.gauge .gl{fill:var(--muted);font-size:13px;text-anchor:middle}
.gauge .note{font-family:var(--f-display);font-weight:800;font-size:46px;text-anchor:middle;fill:var(--ink)}
.gauge .cents{font-family:var(--f-mono);font-size:14px;text-anchor:middle;fill:var(--muted)}
.gauge.intune .needle{stroke:var(--good)}
.turn{display:flex;gap:10px}
.turn .btn{flex:1;padding:16px 10px;font-size:16px;user-select:none;-webkit-user-select:none;touch-action:none}
.strsel .btn{min-width:46px}
.strsel .btn[aria-pressed="true"]{color:var(--ink)}
.hs{width:100%;max-width:300px;display:block;margin:0 auto}
.hs .knob{cursor:pointer}
.hs .knob circle{fill:var(--metal);stroke:var(--surface);stroke-width:2}
.hs .knob:hover circle{fill:var(--wire)}
.hs .knob text{font-size:14px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#1E1B18;pointer-events:none}
.hs .hstr{stroke:var(--metal);stroke-width:1.6;fill:none;transition:stroke-width .15s}
.hs .hstr.on{stroke-width:4.5}
.diag-lbl{fill:var(--ink);font-size:14px;font-weight:700}
.diag-sub{fill:var(--muted);font-size:12px}
.diag-lead{stroke:var(--accent);stroke-width:1.5;fill:none}
.zone-fill{fill:var(--accent);opacity:.35}
.rh text{font-family:var(--f-body)}
.rh-zone{fill:var(--hl);fill-opacity:.3;stroke:var(--hl);stroke-width:3;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 1.5px #fff)}
.rh-anchor{fill:var(--hl);fill-opacity:.15;stroke:var(--hl);stroke-width:3;stroke-dasharray:7 5;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 1.5px #fff)}
.rh-lead{fill:none;stroke:var(--hl);stroke-width:2;vector-effect:non-scaling-stroke}
.rh-lbl{fill:var(--ink);font-size:26px;font-weight:700}
.rh-sub{fill:var(--muted);font-size:20px}
.anchor{fill:none;stroke:var(--accent-ink);stroke-width:2.5;stroke-dasharray:6 5}
.pl text{font-family:var(--f-body)}
.pl-sub{fill:var(--muted);font-size:15px}
.pl-num{fill:var(--muted);font-size:24px;text-anchor:middle;font-variant-numeric:tabular-nums}
.pl-num.on{fill:var(--hl);font-weight:700}
.pl-space{fill:var(--hl);fill-opacity:.18;stroke:var(--hl);stroke-width:2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.pl-target{fill:none;stroke:var(--hl);stroke-width:4;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff)}
.pl-lead{stroke:var(--hl);stroke-width:2;vector-effect:non-scaling-stroke}
.pl-lbl{fill:var(--ink);font-size:18px;font-weight:700}
.finger{fill:#E3B48F;stroke:#9B6B49;stroke-width:1.5}
.nail{fill:#F3DCCB;stroke:#9B6B49;stroke-width:1}

<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><h1>Beginner Guitar</h1><p>A method for absolute beginners</p>
      <div class="prog" id="prog"><span id="progText"></span><div class="bar"><i id="progBar"></i></div></div>
    </div>
    <ul class="nav" id="nav"></ul>
  </aside>
  <main id="main"></main>
</div>

<script>
"use strict";
/* ---------- data ---------- */
const STR={
  1:{name:'e',freq:329.63,color:'#E8BE2C'},
  2:{name:'B',freq:246.94,color:'#EE9638'},
  3:{name:'G',freq:196.00,color:'#E067A3'},
  4:{name:'D',freq:146.83,color:'#4DB36A'},
  5:{name:'A',freq:110.00,color:'#5B9BEA'},
  6:{name:'E',freq:82.41, color:'#E2574B'}
};
const ORD=['','1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th','11th','12th'];
const NOTES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const freqOf=(s,f)=>STR[s].freq*Math.pow(2,f/12);
const noteOf=(s,f)=>NOTES[Math.round(69+12*Math.log2(freqOf(s,f)/440))%12];
const pill=s=>`<span class="pill" style="background:${STR[s].color}">${STR[s].name}</span>`;
const strDesc=s=>`string ${s} (${STR[s].name})`;

/* ---------- storage (per-viewer convenience only) ---------- */
const store={get(k,d){try{const v=localStorage.getItem('bg.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem('bg.'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- audio: Karplus-Strong plucked string ---------- */
let AC=null,OUT=null;
function audio(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();
    const comp=AC.createDynamicsCompressor();OUT=AC.createGain();OUT.gain.value=.9;OUT.connect(comp);comp.connect(AC.destination);}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function pluck(freq,{delay=0,dur=2.6,vol=.55,mode='clean'}={}){
  const c=audio();if(!c)return;
  const sr=c.sampleRate,muted=mode==='mute',len=Math.floor(sr*(muted?.3:dur));
  const buf=c.createBuffer(1,len,sr),d=buf.getChannelData(0);
  const P=Math.max(2,Math.round(sr/freq-.5)),ring=new Float32Array(P);
  for(let i=0;i<P;i++)ring[i]=Math.random()*2-1;
  for(let k=0;k<3;k++)for(let i=1;i<P;i++)ring[i]=(ring[i]+ring[i-1])*.5; // soft thumb attack
  let m=0;for(let i=0;i<P;i++)m+=ring[i];m/=P;for(let i=0;i<P;i++)ring[i]-=m;
  const loss=muted?.82:.997;let idx=0;
  for(let i=0;i<len;i++){const nx=idx+1===P?0:idx+1,v=ring[idx];d[i]=v;ring[idx]=loss*.5*(v+ring[nx]);idx=nx;}
  if(mode==='buzz'){for(let i=0;i<len;i++){const v=d[i];d[i]=Math.tanh(v*6)*.6+(Math.random()*2-1)*Math.min(1,Math.abs(v)*5)*.35*Math.exp(-i/(sr*.9));}}
  let pk=0;for(let i=0;i<len;i++)pk=Math.max(pk,Math.abs(d[i]));if(pk)for(let i=0;i<len;i++)d[i]/=pk;
  const src=c.createBufferSource(),g=c.createGain(),t=c.currentTime+delay+.01;
  src.buffer=buf;g.gain.setValueAtTime(vol,t);g.gain.setTargetAtTime(0,t+(muted?.1:dur*.75),.12);
  src.connect(g);g.connect(OUT);src.start(t);src.stop(t+len/sr+.6);
}
const playNote=(s,f,o)=>pluck(freqOf(s,f),o);
function strum(notes,gap=.03){[...notes].sort((a,b)=>b[0]-a[0]).forEach(([s,f],i)=>playNote(s,f,{delay:i*gap,vol:.38}));}

/* ---------- helpers ---------- */
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;};
const mount=(root,name,node)=>{const slot=root.querySelector(`[data-w="${name}"]`);if(slot)slot.replaceWith(node);};

/* ---------- fretboard (player's view: headstock left, thinnest string on top) ---------- */
function Fretboard({frets=7,phoneFrets=null,onTap=null,readout=true,orient=true,hint='Tap anywhere on the neck to hear that note.'}={}){
  // On phone-width screens, a long neck shows fewer frets so it fits without sideways scrolling.
  if(phoneFrets&&window.matchMedia('(max-width: 600px)').matches)frets=Math.min(frets,phoneFrets);
  const W=frets<=7?640:900,x0=86,x1=W-14,gy=30,sy=s=>24+(s-1)*gy,top=10,bot=sy(6)+14,H=bot+28;
  const span=1-Math.pow(2,-frets/12);
  const fx=f=>f<=0?x0:x0+(x1-x0)*(1-Math.pow(2,-f/12))/span;
  const mx=f=>f===0?56:fx(f)-(fx(f)-fx(f-1))*.3;
  let s=`<svg class="fb" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fretboard, ${frets} frets. Headstock on the left, thinnest string on top.">`;
  s+=`<rect class="fb-open" x="34" y="${top}" width="${x0-42}" height="${bot-top}" rx="6"/>`;
  s+=`<rect class="fb-board" x="${x0}" y="${top}" width="${x1-x0}" height="${bot-top}"/>`;
  const mid=(sy(1)+sy(6))/2;
  // Dots match the Martin in the photos: 5, 7 (double), 9, 12 (double).
  [5,7,9,12].filter(f=>f<=frets).forEach(f=>{const cx=(fx(f-1)+fx(f))/2;
    if(f===7||f===12)s+=`<circle class="fb-dot" cx="${cx}" cy="${sy(2)+gy/2}" r="6"/><circle class="fb-dot" cx="${cx}" cy="${sy(4)+gy/2}" r="6"/>`;
    else s+=`<circle class="fb-dot" cx="${cx}" cy="${mid}" r="6"/>`;});
  for(let f=1;f<=frets;f++)s+=`<line class="fb-wire" x1="${fx(f)}" x2="${fx(f)}" y1="${top}" y2="${bot}"/>`;
  s+=`<rect class="fb-nut" x="${x0-7}" y="${top-2}" width="8" height="${bot-top+4}" rx="2"/>`;
  for(let k=1;k<=6;k++)s+=`<line class="fb-str" x1="34" x2="${x1}" y1="${sy(k)}" y2="${sy(k)}" stroke-width="${(.9+(k-1)*.5).toFixed(2)}"/>`;
  for(let k=1;k<=6;k++)s+=`<circle cx="15" cy="${sy(k)}" r="11" fill="${STR[k].color}"/><text class="fb-lbl" x="15" y="${sy(k)}">${STR[k].name}</text>`;
  s+=`<text class="fb-num" x="56" y="${H-8}">open</text>`;
  for(let f=1;f<=frets;f++)s+=`<text class="fb-num" x="${(fx(f-1)+fx(f))/2}" y="${H-8}">${f}</text>`;
  for(let k=1;k<=6;k++)for(let f=0;f<=frets;f++){
    const a=f===0?34:fx(f-1),b=f===0?x0:fx(f);
    s+=`<rect class="fb-hit" data-s="${k}" data-f="${f}" x="${a}" y="${sy(k)-gy/2}" width="${b-a}" height="${gy}"><title>${strDesc(k)}, ${f?('fret '+f):'open'}</title></rect>`;}
  s+=`<g class="fb-marks"></g></svg>`;
  const el=h(`<div class="fbw"><div class="scroll">${s}</div>
    ${orient?'<div class="orient"><span>← toward the headstock</span><span>Thinnest string on top</span><span>toward the body →</span></div>':''}
    ${readout?`<div class="fb-readout" aria-live="polite">${hint}</div>`:''}</div>`);
  const marksG=el.querySelector('.fb-marks'),ro=el.querySelector('.fb-readout');
  let base=[];
  function draw(list,popKey){
    marksG.innerHTML=list.map(m=>{const x=mx(m.f),y=sy(m.s),open=m.f===0;
      // Big filled dot in the string's color (open strings too), with a ring that pulses out when the note sounds.
      return `<g class="fb-mark${open?' open':''}${popKey&&m.pop?' pop':''}"><circle class="halo" cx="${x}" cy="${y}" r="15" fill="${STR[m.s].color}"/><circle class="dot" cx="${x}" cy="${y}" r="14.5" fill="${STR[m.s].color}"/><text x="${x}" y="${y}">${m.label??m.f}</text></g>`;}).join('');
  }
  let tmo;
  const api={el,
    setMarks(list){base=list.map(m=>({...m,pop:true}));draw(base,true);},
    flash(s,f){clearTimeout(tmo);draw([...base.filter(m=>!(m.s===s)),{s,f,pop:true}],true);tmo=setTimeout(()=>draw(base),900);},
    say(t){if(ro)ro.innerHTML=t;}
  };
  el.querySelector('svg').addEventListener('click',e=>{
    const t=e.target.closest('[data-s]');if(!t)return;
    const s=+t.dataset.s,f=+t.dataset.f;
    if(onTap&&onTap(s,f,api)===false)return;
    playNote(s,f);api.flash(s,f);
    api.say(`${pill(s)} ${strDesc(s)} · ${f?`fret ${f}`:'open (fret 0)'} · note ${noteOf(s,f)}`);
  });
  return api;
}

/* ---------- tab ---------- */
function Tab(events,{onCol}={}){
  const colW=44,x0=48,hasCh=events.some(e=>e.c),top=hasCh?40:18,ly=s=>top+(s-1)*20,W=x0+events.length*colW+14,H=ly(6)+16;
  let s=`<svg class="tab" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Tab">`;
  events.forEach((e,i)=>{s+=`<rect class="cur" data-c="${i}" x="${x0+i*colW+3}" y="${ly(1)-12}" width="${colW-6}" height="${ly(6)-ly(1)+24}" rx="6"/>`;});
  for(let k=1;k<=6;k++){s+=`<line class="l" x1="${x0-12}" x2="${W-10}" y1="${ly(k)}" y2="${ly(k)}"/><text class="tl" x="18" y="${ly(k)}">${STR[k].name}</text>`;}
  s+=`<line class="bar" x1="${x0-12}" x2="${x0-12}" y1="${ly(1)}" y2="${ly(6)}"/><line class="bar" x1="${W-10}" x2="${W-10}" y1="${ly(1)}" y2="${ly(6)}"/>`;
  events.forEach((e,i)=>{
    const cx=x0+i*colW+colW/2;
    if(e.c&&(i===0||events[i-1].c!==e.c))s+=`<text class="ch" x="${cx-10}" y="20">${e.c}</text>`;
    if(e.bar&&i<events.length-1)s+=`<line class="bar" x1="${x0+(i+1)*colW}" x2="${x0+(i+1)*colW}" y1="${ly(1)}" y2="${ly(6)}"/>`;
    s+=`<g class="col" data-i="${i}"><rect x="${x0+i*colW}" y="${ly(1)-12}" width="${colW}" height="${ly(6)-ly(1)+24}" fill="transparent"/>`;
    e.n.forEach(([st,f])=>{s+=`<rect class="tb" x="${cx-11}" y="${ly(st)-9}" width="22" height="18"/><text class="tn" x="${cx}" y="${ly(st)}">${f}</text>`;});
    s+=`</g>`;
  });
  s+=`</svg>`;
  const el=h(s);
  el.addEventListener('click',e=>{const g=e.target.closest('.col');if(g&&onCol)onCol(+g.dataset.i);});
  return {el,setCur(i){el.querySelectorAll('.cur').forEach(r=>r.classList.toggle('on',+r.dataset.c===i));
    const r=el.querySelector(`.cur[data-c="${i}"]`);const sc=el.closest('.scroll');
    if(r&&sc&&sc.scrollWidth>sc.clientWidth){const x=+r.getAttribute('x');sc.scrollTo({left:Math.max(0,x-sc.clientWidth/3),behavior:'smooth'});}}};
}

/* ---------- song player: tab + fretboard in sync ---------- */
let STOP_ALL=[];
function Player(song,{frets=7,phoneFrets=null,bpm=80}={}){
  const el=h(`<div class="player">
    <div class="row"><button class="btn primary play" type="button">▶ Play</button>
      <label class="row" style="gap:6px">Speed <select aria-label="Speed"><option value="40">Very slow</option><option value="55">Slow</option><option value="70">Medium</option><option value="95">Full</option></select></label>
      <span class="cap">Tap any column to hear it on its own.</span></div>
    <div class="scroll tabbox"></div><div class="fbbox"></div></div>`);
  const sel=el.querySelector('select');sel.value=String(bpm<=45?40:bpm<=60?55:bpm<=80?70:95);
  const fb=Fretboard({frets,phoneFrets,orient:false,hint:''});
  const describe=e=>e.n.length>1?`${e.c?`<b>${e.c}</b> · `:''}${e.n.length} strings together, thickest to thinnest in one stroke`:`${pill(e.n[0][0])} ${strDesc(e.n[0][0])} · ${e.n[0][1]?`fret ${e.n[0][1]}`:'open (0) — still pluck it'}`;
  const show=i=>{const e=song[i];tab.setCur(i);fb.setMarks(e.n.map(([s,f])=>({s,f})));fb.say(describe(e));};
  const sound=i=>{const e=song[i];e.n.length>1?strum(e.n):playNote(e.n[0][0],e.n[0][1]);};
  const tab=Tab(song,{onCol:i=>{stop();show(i);sound(i);}});
  el.querySelector('.tabbox').append(tab.el);el.querySelector('.fbbox').append(fb.el);
  const btn=el.querySelector('.play');let timers=[],playing=false;
  function stop(){timers.forEach(clearTimeout);timers=[];playing=false;btn.textContent='▶ Play';}
  function play(){STOP_ALL.forEach(f=>f());audio();const spb=60/+sel.value;let t=.15;
    song.forEach((e,i)=>{timers.push(setTimeout(()=>{show(i);sound(i);},t*1000));t+=e.b*spb;});
    timers.push(setTimeout(()=>{stop();tab.setCur(-1);},t*1000+300));playing=true;btn.textContent='■ Stop';}
  btn.addEventListener('click',()=>playing?stop():play());
  STOP_ALL.push(stop);
  return el;
}

/* ---------- chord diagram (headstock at top, thicker strings on the left) ---------- */
function Chord({name,frets,fingers={}}){
  const xs=k=>28+(6-k)*24,ny=58,fy=j=>ny+j*34;
  let s=`<svg class="chord" viewBox="0 0 176 236" role="img" aria-label="${name} chord diagram">`;
  s+=`<text class="name" x="88" y="28">${name}</text>`;
  s+=`<g class="grid">`;for(let k=1;k<=6;k++)s+=`<line x1="${xs(k)}" x2="${xs(k)}" y1="${ny}" y2="${fy(4)}" stroke-width="${(.8+(k-1)*.35).toFixed(2)}"/>`;
  for(let j=1;j<=4;j++)s+=`<line x1="${xs(6)}" x2="${xs(1)}" y1="${fy(j)}" y2="${fy(j)}"/>`;s+=`</g>`;
  s+=`<rect class="nutbar" x="${xs(6)-1}" y="${ny-5}" width="${xs(1)-xs(6)+2}" height="6"/>`;
  for(let k=1;k<=6;k++){const f=frets[k];
    if(f==='x'){const x=xs(k),y=ny-16;s+=`<line class="xm" x1="${x-5}" y1="${y-5}" x2="${x+5}" y2="${y+5}"/><line class="xm" x1="${x+5}" y1="${y-5}" x2="${x-5}" y2="${y+5}"/>`;}
    else if(f===0)s+=`<circle class="om" cx="${xs(k)}" cy="${ny-16}" r="6"/>`;
    else s+=`<circle class="dot" cx="${xs(k)}" cy="${fy(f)-17}" r="10"/><text class="fn" x="${xs(k)}" y="${fy(f)-17}">${fingers[k]||''}</text>`;}
  for(let k=1;k<=6;k++)s+=`<text class="sn" x="${xs(k)}" y="${fy(4)+20}" fill="${STR[k].color}">${STR[k].name}</text>`;
  s+=`</svg>`;
  const notes=Object.entries(frets).filter(([k,f])=>f!=='x').map(([k,f])=>[+k,f]);
  const el=h(`<button type="button" class="chordcard" aria-label="Strum ${name}">${s}<span class="cap">Tap to strum</span></button>`);
  el.addEventListener('click',()=>strum(notes));
  return el;
}
const CH={
  Em:{name:'Em',frets:{6:0,5:2,4:2,3:0,2:0,1:0},fingers:{5:2,4:3}},
  Am:{name:'Am',frets:{6:'x',5:0,4:2,3:2,2:1,1:0},fingers:{4:2,3:3,2:1}}
};
const EM=[[6,0],[5,2],[4,2],[3,0],[2,0],[1,0]],AM=[[5,0],[4,2],[3,2],[2,1],[1,0]];

/* ---------- songs ---------- */
const N=(s,f,b=1,extra={})=>({n:[[s,f]],b,...extra});
const SONGS={
  // Starts on the open D string; only the D and A strings, frets 0-3 (D D F D C Bb A).
  sna:[N(4,0,1.5),N(4,0,.5),N(4,3,.75),N(4,0,.75),N(5,3,.5),N(5,1,2),N(5,0,2,{bar:true}),
       N(4,0,1.5),N(4,0,.5),N(4,3,.75),N(4,0,.75),N(5,3,.5),N(5,1,2),N(5,0,2)],
  nem:[6,3,2,1,2,3,6,3,2,1,2,3].map((s,i)=>N(s,0,.5,{bar:i===5})),
  nemEm:[...EM.map(([s,f])=>N(s,f,.75)),N(2,0,.75),N(3,0,.75,{bar:true}),...EM.map(([s,f])=>N(s,f,.75)),N(2,0,.75),N(3,0,.75)],
  emStrum:Array.from({length:8},(_,i)=>({n:EM,b:1,bar:i===3})),
  emAm:[...Array.from({length:4},(_,i)=>({n:EM,b:1,c:'Em',bar:i===3})),...Array.from({length:4},(_,i)=>({n:AM,b:1,c:'Am',bar:i===3})),
        ...Array.from({length:4},(_,i)=>({n:EM,b:1,c:'Em',bar:i===3})),...Array.from({length:2},()=>({n:AM,b:1,c:'Am'})),{n:EM,b:2,c:'Em'}],
  // Builds up slowly: four notes on the thinnest string, then the B string joins, then the rest. Frets 0-3 only.
  tq:[N(1,3),N(1,1),N(1,0),N(2,1,1,{bar:true}),N(2,3),N(1,2),N(3,2),N(3,0,1,{bar:true}),N(4,2),N(5,3),N(6,0),N(6,1)],
  zig:[N(1,3),N(1,1),N(1,0),N(1,2,1,{bar:true}),
       N(1,3),N(2,1),N(1,0),N(2,3,1,{bar:true}),
       N(1,2),N(2,0),N(3,2),N(2,1,1,{bar:true}),
       N(3,0),N(4,2),N(2,3),N(1,0,1,{bar:true}),
       N(5,3),N(4,0),N(3,2),N(2,1,1,{bar:true}),
       N(1,0),N(4,2),N(6,3),N(2,1),N(5,0),N(3,2),N(6,1),N(1,3)]
};

/* ---------- widgets ---------- */
function Anatomy(){
  // Photo: Martin D-28 by Niranjan Arminius, CC BY-SA 4.0 (background removed). Shapes are in the photo's pixel space (598 × 1500).
  const body='M433 750 L457 760 L474 770 L485 780 L494 790 L500 800 L504 810 L508 820 L510 830 L512 840 L513 850 L514 860 L514 870 L513 880 L512 890 L512 900 L510 910 L509 920 L508 930 L506 940 L504 950 L504 960 L504 970 L502 980 L502 990 L502 1000 L502 1010 L504 1020 L506 1030 L508 1040 L512 1050 L515 1060 L519 1070 L523 1080 L528 1090 L532 1100 L537 1110 L541 1120 L545 1130 L550 1140 L554 1150 L559 1160 L562 1170 L567 1180 L572 1190 L574 1200 L577 1210 L581 1220 L583 1230 L585 1240 L587 1250 L588 1260 L589 1270 L590 1280 L591 1290 L591 1300 L589 1310 L589 1320 L587 1330 L585 1340 L582 1350 L579 1360 L575 1370 L570 1380 L564 1390 L557 1400 L550 1410 L541 1420 L531 1430 L519 1440 L504 1450 L485 1460 L461 1470 L426 1480 L358 1490 L300 1496 L183 1490 L149 1480 L119 1470 L98 1460 L81 1450 L68 1440 L58 1430 L49 1420 L41 1410 L34 1400 L28 1390 L23 1380 L18 1370 L15 1360 L12 1350 L10 1340 L8 1330 L6 1320 L6 1310 L6 1300 L6 1290 L6 1280 L7 1270 L8 1260 L10 1250 L13 1240 L15 1230 L18 1220 L21 1210 L25 1200 L29 1190 L32 1180 L37 1170 L41 1160 L45 1150 L50 1140 L54 1130 L59 1120 L63 1110 L68 1100 L72 1090 L76 1080 L80 1070 L85 1060 L88 1050 L91 1040 L93 1030 L96 1020 L98 1010 L98 1000 L98 990 L98 980 L98 970 L96 960 L95 950 L94 940 L92 930 L90 920 L90 910 L88 900 L88 890 L87 880 L86 870 L86 860 L87 850 L88 840 L90 830 L93 820 L96 810 L101 800 L108 790 L115 780 L126 770 L142 760 L167 750Z';
  const head='M250 9 L351 9 L340 213 L265 213Z';
  const knobs=[[231,55],[231,110],[231,165],[363,55],[363,110],[363,165]];
  const dots=[[301,436],[282,516],[321,516],[301,586],[282,676],[320,676],[302,754],[302,799]];
  const P={

function StrumPad(){
  const el=h(`<div class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="pad" aria-label="Strum pad: swipe across the strings, or tap one string"><div class="hole"></div></div>
    <div class="cap">Drawn as if you're looking at the front of your guitar with the headstock to the left: thickest string on the bottom. Swipe from the thickest string to the thinnest, the same order your thumb's downward stroke hits them, or tap one string.</div></div>`);
  const pad=el.querySelector('.pad'),Y=s=>28+(s-1)*35,lines={};
  for(let s=6;s>=1;s--){const l=h(`<div class="s" style="top:${Y(s)}px;border-top-width:${(1+(s-1)*.6).toFixed(1)}px"></div>`);pad.append(l);lines[s]=l;
    pad.append(h(`<span class="sl" style="top:${Y(s)}px;background:${STR[s].color}">${STR[s].name}</span>`));}
  let lastY=null;
  const hitS=s=>{playNote(s,0,{vol:.42});const l=lines[s];l.classList.remove('v');void l.offsetWidth;l.classList.add('v');};
  const rel=e=>e.clientY-pad.getBoundingClientRect().top;
  pad.addEventListener('pointerdown',e=>{audio();pad.setPointerCapture(e.pointerId);lastY=rel(e);
    for(let s=1;s<=6;s++)if(Math.abs(Y(s)-lastY)<14)hitS(s);});
  pad.addEventListener('pointermove',e=>{if(lastY==null)return;const y=rel(e);
    for(let s=1;s<=6;s++){const ys=Y(s);if((lastY<ys&&y>=ys)||(lastY>ys&&y<=ys))hitS(s);}lastY=y;});
  const end=()=>lastY=null;pad.addEventListener('pointerup',end);pad.addEventListener('pointercancel',end);
  return el;
}

function Headstock(){
  // 3+3 headstock. Left pegs D, A, E (top to bottom); right pegs G, B, e.
  const posts={4:[118,60],5:[118,110],6:[118,160],3:[182,60],2:[182,110],1:[182,160]};
  const slot={6:124,5:134,4:144,3:156,2:166,1:176};
  let s=`<svg class="hs" viewBox="0 0 300 360" role="img" aria-label="Headstock with six tuning pegs">
   <path class="hs-wood" d="M96 18 L204 18 Q214 20 212 32 L196 240 L104 240 L88 32 Q86 20 96 18Z"/>
   <rect x="116" y="246" width="68" height="114" fill="var(--board)"/><line x1="116" x2="184" y1="318" y2="318" stroke="var(--wire)" stroke-width="3"/>
   <rect class="fb-nut" x="112" y="238" width="76" height="9" rx="2"/>`;
  for(let k=1;k<=6;k++){const [px,py]=posts[k];s+=`<path class="hstr" data-hs="${k}" d="M${px} ${py} L${slot[k]} 242 L${slot[k]} 360"/>`;}
  for(let k=1;k<=6;k++){const [px,py]=posts[k],left=px<150,kx=left?42:258;
    s+=`<g class="knob" data-k="${k}" role="button" tabindex="0" aria-label="Peg ${k}"><rect x="${left?kx:px}" y="${py-3}" width="${Math.abs(px-kx)}" height="6" fill="var(--metal)"/><circle cx="${kx}" cy="${py}" r="20"/><text x="${kx}" y="${py}">?</text></g>
      <circle class="post" cx="${px}" cy="${py}" r="6"/>`;}
  s+=`</svg>`;
  const el=h(`<div class="twocol"><div>${s}</div><div style="display:flex;flex-direction:column;gap:12px">
     <div class="card" style="display:flex;flex-direction:column;gap:10px"><b>Find the peg</b><div class="feedback" aria-live="polite"></div>
       <div class="row"><button type="button" class="btn" data-a="reveal">Show all labels</button><button type="button" class="btn" data-a="next">New string</button></div></div>
     <p class="cap">Guitar shown face-on with the headstock pointing up, like the photo in Parts of the Guitar. Trace each string from the bridge up past the nut to the post it winds around.</p></div></div>`);
  const fbk=el.querySelector('.feedback');let target=0;
  const light=k=>el.querySelectorAll('.hstr').forEach(p=>{const on=+p.dataset.hs===k;p.classList.toggle('on',on);p.style.stroke=on?STR[k].color:'';});
  const label=(k,show)=>{const t=el.querySelector(`.knob[data-k="${k}"] text`);t.textContent=show?STR[k].name:'?';t.parentNode.querySelector('circle').style.fill=show?STR[k].color:'';};
  const ask=()=>{let n;do{n=1+Math.floor(Math.random()*6);}while(n===target);target=n;for(let k=1;k<=6;k++)label(k,false);light(0);
    fbk.className='feedback';fbk.innerHTML=`Tap the peg that turns the ${pill(n)} string (string ${n}).`;};
  const tap=k=>{light(k);playNote(k,0);label(k,true);
    if(!target)return;
    if(k===target){fbk.className='feedback ok';fbk.innerHTML=`Yes. That peg turns the ${STR[k].name} string. Follow the colored line down to see it.`;target=0;}
    else{fbk.className='feedback no';fbk.innerHTML=`That one turns the ${pill(k)} string. Turning it won't change the ${STR[target].name} string, so don't force it. Trace again.`;}};
  el.addEventListener('click',e=>{const k=e.target.closest('.knob');if(k)return tap(+k.dataset.k);
    const a=e.target.closest('[data-a]');if(!a)return;if(a.dataset.a==='next')ask();else{for(let i=1;i<=6;i++)label(i,true);target=0;fbk.className='feedback';fbk.textContent='All six labeled. Tap any peg to hear and trace its string.';}});
  el.addEventListener('keydown',e=>{const k=e.target.closest('.knob');if(k&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tap(+k.dataset.k);}});
  ask();return el;
}

function TunerTrainer(){
  const el=h(`<div class="card" style="display:flex;flex-direction:column;gap:16px">
    <div class="row strsel" role="group" aria-label="String to tune">${[6,5,4,3,2,1].map(s=>`<button type="button" class="btn" data-s="${s}" style="border-color:${STR[s].color}">${STR[s].name}</button>`).join('')}</div>
    <div class="tuner"><svg class="gauge" viewBox="0 0 300 200" role="img" aria-label="Tuner needle">
      <path class="arc" d="M46.1 90 A120 120 0 0 1 253.9 90"/><path class="zone" d="M137.5 30.7 A120 120 0 0 1 162.5 30.7"/>
      ${[-50,-25,0,25,50].map(c=>{const a=c/50*60*Math.PI/180;return `<line class="tick" x1="${150+100*Math.sin(a)}" y1="${150-100*Math.cos(a)}" x2="${150+88*Math.sin(a)}" y2="${150-88*Math.cos(a)}"/>`;}).join('')}
      <text class="gl" x="40" y="118">♭ flat</text><text class="gl" x="260" y="118">sharp ♯</text>
      <line class="needle" x1="150" y1="150" x2="150" y2="40"/><circle class="hub" cx="150" cy="150" r="7"/>
      <text class="note" x="150" y="190"></text><text class="cents" x="150" y="128"></text></svg>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="turn"><button type="button" class="btn" data-d="-1">↓ Loosen<br><small style="font-weight:400">pitch goes down</small></button><button type="button" class="btn primary" data-d="1">↑ Tighten<br><small style="font-weight:400">pitch goes up</small></button></div>
        <div class="feedback" aria-live="polite"></div>
        <p class="cap">Hold a button to keep turning. The string replucks while you turn, just like you'll keep plucking the real one.</p></div></div></div>`);
  const needle=el.querySelector('.needle'),gauge=el.querySelector('.gauge'),fbk=el.querySelector('.feedback');
  let s=6,c=-30,lastDir=0,hold=null,lastPluck=0;
  const render=()=>{needle.style.transform=`rotate(${Math.max(-62,Math.min(62,c/50*60))}deg)`;needle.style.transformOrigin='150px 150px';
    el.querySelector('.note').textContent=STR[s].name;el.querySelector('.cents').textContent=`${c>0?'+':''}${Math.round(c)} cents`;
    gauge.classList.toggle('intune',Math.abs(c)<=3);};
  const judge=()=>{const a=Math.abs(c);
    if(a<=3){if(lastDir>0){fbk.className='feedback ok';fbk.textContent='In tune. You came up to the note, so it will hold. Pick another string.';}
      else{fbk.className='feedback no';fbk.textContent='On the note, but you came down to it. Loosen a little below, then tighten up to it.';}}
    else if(c>0){fbk.className='feedback no';fbk.textContent='Sharp (too high). Loosen until you\'re below the note, then tighten back up to it.';}
    else{fbk.className='feedback';fbk.textContent=a>25?'Flat (too low). Tighten toward the note.':'Getting close. Keep tightening, slowly.';}};
  const pick=n=>{s=n;c=Math.random()<.3?18+Math.random()*20:-(15+Math.random()*30);lastDir=0;
    el.querySelectorAll('.strsel .btn').forEach(b=>{const on=+b.dataset.s===s;b.setAttribute('aria-pressed',on);b.style.background=on?STR[b.dataset.s].color:'';});
    render();judge();};
  const ring=()=>{const now=performance.now();if(now-lastPluck>420){lastPluck=now;pluck(STR[s].freq*Math.pow(2,c/1200),{vol:.45,dur:1.6});}};
  const step=d=>{c=Math.max(-60,Math.min(60,c+d*1.2));lastDir=d;render();ring();};
  el.querySelectorAll('.turn .btn').forEach(b=>{const d=+b.dataset.d;
    b.addEventListener('pointerdown',e=>{e.preventDefault();audio();lastPluck=0;step(d);clearInterval(hold);hold=setInterval(()=>step(d),70);});
    const up=()=>{if(hold){clearInterval(hold);hold=null;judge();}};
    b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);
    b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();step(d*2);judge();}});});
  el.querySelector('.strsel').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b)pick(+b.dataset.s);});
  pick(6);return el;
}

// Read-the-tab game: the highlighted tab number is the target; tap it on the fretboard to move on.
function TabQuiz(seq){
  const el=h(`<div class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="row" style="justify-content:space-between"><b>Tap this note on the fretboard</b><span class="cap tq-n"></span></div>
    <div class="scroll tabbox"></div><div class="fbbox"></div>
    <div class="feedback" aria-live="polite"></div>
    <div class="row"><button type="button" class="btn tq-hint">Show me</button><button type="button" class="btn tq-reset">Start over</button></div></div>`);
  const fbk=el.querySelector('.feedback'),cnt=el.querySelector('.tq-n'),hint=el.querySelector('.tq-hint');
  let i=0,busy=false;
  const tab=Tab(seq);
  const fb=Fretboard({frets:3,readout:false,orient:false,onTap:(s,f)=>{tap(s,f);return false;}});
  el.querySelector('.tabbox').append(tab.el);el.querySelector('.fbbox').append(fb.el);
  const show=()=>{busy=false;tab.setCur(i);fb.setMarks([]);cnt.textContent=`Note ${i+1} of ${seq.length}`;hint.hidden=false;};
  function tap(s,f){
    if(busy||i>=seq.length)return;
    const [ts,tf]=seq[i].n[0];playNote(s,f);
    if(s===ts&&f===tf){
      fb.setMarks([{s,f}]);fbk.className='feedback ok';
      fbk.innerHTML=`Yes! ${pill(s)} ${strDesc(s)}, ${f?`fret ${f}`:'open'}.`;
      i++;busy=true;
      if(i>=seq.length){cnt.textContent='Done';hint.hidden=true;fbk.innerHTML='You read the whole line of tab. Nice work!';tab.setCur(-1);busy=false;}
      else setTimeout(show,650);
    }else{
      fb.flash(s,f);fbk.className='feedback no';
      fbk.innerHTML=s!==ts?`That's the ${STR[s].name} string. Check which line the number is on: top line is the thinnest string.`
        :`Right string! That's ${f?`fret ${f}`:'open'}. The number in the tab is the fret${tf===0?': 0 means open, no finger down':''}.`;
    }
  }
  hint.onclick=()=>{if(i<seq.length){const [ts,tf]=seq[i].n[0];fb.setMarks([{s:ts,f:tf}]);fbk.className='feedback';fbk.textContent='Here it is. Tap it to keep going.';}};
  el.querySelector('.tq-reset').onclick=()=>{i=0;fbk.className='feedback';fbk.textContent='';show();};
  show();return el;
}

function MapQuiz(){
  const Q=[
    {q:'Find the first dot on the neck. Which fret is it?',choices:[3,5,7],a:5,ok:'Right. The first dot is on the 5th fret.'},
    {q:'Tap anywhere on the 2nd fret.',check:(s,f)=>f===2,ok:'Yes. Any string works; the 2nd fret runs across all six.',no:(s,f)=>f===0?'That\'s an open string (fret 0). Move toward the body.':`That's fret ${f}. Count the spaces from the nut.`},
    {q:'Tap the 3rd string, 4th fret.',hint:'The 3rd string is the 3rd thinnest.',check:(s,f)=>s===3&&f===4,ok:'Got it: the G string, 4th fret.',no:(s,f)=>s!==3?`That's ${strDesc(s)}. Count from the thinnest string: e is 1, B is 2, G is 3.`:`Right string. That's fret ${f}, though; you want 4.`},
    {q:'Tap the thickest string, open.',check:(s,f)=>s===6&&f===0,ok:'Yes. Open means no finger down: fret 0, at the nut.',no:(s,f)=>s!==6?`That's ${strDesc(s)}. The thickest string is string 6, at the bottom of this picture.`:'Right string. Open means no finger at all; tap the "open" column to the left of the nut.'},
    {q:'Now play that note. Even with no finger down, you still pluck it.',pluck:true}
  ];
  let i=0;
  const el=h(`<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="row" style="justify-content:space-between"><b class="qq"></b><span class="cap qn"></span></div>
    <div class="qh cap"></div><div class="row qc"></div><div class="slot"></div><div class="feedback" aria-live="polite"></div><div class="row"><button type="button" class="btn qnext" hidden>Next question →</button></div></div>`);
  const fbk=el.querySelector('.feedback'),nx=el.querySelector('.qnext');
  const fb=Fretboard({frets:5,readout:false,orient:false,onTap:(s,f,api)=>{const q=Q[i];if(!q.check)return;
    if(q.check(s,f)){fbk.className='feedback ok';fbk.textContent=q.ok;nx.hidden=false;}else{fbk.className='feedback no';fbk.textContent=q.no(s,f);}}});
  el.querySelector('.slot').append(fb.el);
  const show=()=>{const q=Q[i];el.querySelector('.qq').textContent=q.q;el.querySelector('.qn').textContent=`Question ${i+1} of ${Q.length}`;
    el.querySelector('.qh').textContent=q.hint||'';fbk.className='feedback';fbk.textContent='';nx.hidden=true;fb.setMarks([]);
    const qc=el.querySelector('.qc');qc.innerHTML='';
    if(q.choices)q.choices.forEach(c=>{const b=h(`<button type="button" class="btn">Fret ${c}</button>`);b.onclick=()=>{if(c===q.a){fbk.className='feedback ok';fbk.textContent=q.ok;nx.hidden=false;}else{fbk.className='feedback no';fbk.textContent=`Not quite. Look for the first dot after the nut, then count the spaces from the nut.`;}};qc.append(b);});
    if(q.pluck){fb.setMarks([{s:6,f:0}]);const b=h(`<button type="button" class="btn primary">Pluck the open E string</button>`);b.onclick=()=>{playNote(6,0);fbk.className='feedback ok';fbk.textContent='That\'s the open E. Quiz done.';};qc.append(b);
      const r=h(`<button type="button" class="btn">Start over</button>`);r.onclick=()=>{i=0;show();};qc.append(r);}
  };
  nx.onclick=()=>{i=Math.min(Q.length-1,i+1);show();};
  show();return el;
}

{t:'Parts of the Guitar',html:`
  <p class="lead">You only need to know a handful of parts. Tap the guitar or a name to learn each one.</p>
  <p class="prose">Acoustic or electric doesn't matter here: the parts you'll use, and everything in this course, work the same way on both.</p>
  <div data-w="anat"></div>`,
 mount(r){mount(r,'anat',Anatomy());}},

{t:'Words We Use',html:`
  <p class="lead">Guitar talk gets confusing fast because "high" and "up" can mean different things. This course always uses these words the same way.</p>
  <div class="terms">
    <div class="term"><h4>Thicker / thinner</h4><p>How we describe <b>strings</b>.</p><div class="say"><span class="y">"the thicker string"</span><span class="n">"the higher string"</span></div><p class="cap">The thickest string sits highest when you hold the guitar but plays the lowest pitch. "Higher string" could mean either, so we never say it.</p></div>
    <div class="term"><h4>Higher / lower</h4><p>Always <b>pitch</b>, and fret numbers.</p><div class="say"><span class="y">"a higher fret"</span></div><p class="cap">Higher means moving your left hand to your right, toward the body of the guitar. Lower means moving your left hand to the left, toward the headstock. It also means a higher or lower fret number.</p></div>
  </div>
  <section class="block"><h3>Quick check</h3><div data-w="q"></div></section>`,
 mount(r){mount(r,'q',TermQuiz([
   {q:'Which is the right way to describe the E string with the big fat sound?',o:['the thickest string','the lowest string'],a:0,why:'Right. Strings are always thicker or thinner.',no:'"Lowest" could mean pitch or position. Strings are thicker or thinner.'},
   {q:'Your teacher says "move to a higher fret." Which way do you go?',o:['toward the headstock','toward the body'],a:1,why:'Yes. Higher fret numbers are toward the body, and higher in pitch.'}]));}},

{t:'Holding the Guitar',html:`
  <p class="lead">Your right arm and right leg hold the guitar. Your left hand holds nothing, which leaves it free to move.</p>
  <section class="block"><div class="photo-wrap"><figure><img src="${'{{IMG.hold}}'}" alt="Seated player holding an acoustic guitar on the right leg with the right forearm over the body"><figcaption>Seated, guitar on the right leg.</figcaption></figure>
    <div class="annot"><div><b>Right leg</b><span>The guitar's waist rests on your right leg (for right-handed players).</span></div>
      <div><b>Right forearm</b><span>Rests over the top edge of the body. Arm and leg hold the guitar together.</span></div>
      <div><b>Left hand</b><span>Bears zero weight. You should be able to take it off the neck completely and the guitar stays put.</span></div></div></div></section>
  <section class="block"><h3>Small things that matter</h3><ul class="points">
    <li><b>Keep the guitar upright.</b> Don't tilt it toward you to see your hands. Tilting bends your left wrist, and every tendon to your fingers runs through it. Worth avoiding from day one.</li>
    <li><b>Sit reasonably upright.</b> Resist the urge to hunch.</li>
    <li><b>Looking at your fingers is fine.</b> You'll need to lean your head forward to check where your fingers are going, especially at first. Keep it to a minimum and move your head, not the guitar.</li></ul></section>
  <section class="block"><div class="photo-wrap"><figure><img src="${'{{IMG.mistake}}'}" alt="Player tilting the guitar up toward himself, with the left wrist bent sharply"><figcaption>Common mistake: guitar tilted up, left wrist bent.</figcaption></figure>
    <div class="callout warn"><b class="t">Common mistake</b><p>Pointing the guitar up so you can see the fingerboard. It feels helpful, but it bends your left wrist into a strained angle and makes every note harder.</p></div></div></section>
  <div class="callout calm"><b class="t">Stay relaxed</b><p>You'll see this all through the course. Tension works against technique in almost every way. If something hurts or feels like a fight, stop, shake out your hands, and loosen up before trying again.</p></div>
  <section class="block"><h3>Posture check</h3><p class="prose">Run through this each time you pick up the guitar.</p><div data-w="ck"></div></section>`,
 mount(r){mount(r,'ck',Checklist(['Guitar\'s waist on my right leg','Right forearm resting over the top of the body','I can let go with my left hand and the guitar stays put','Guitar upright, not tilted toward me','Shoulders loose, not hunched'],'posture'));}},

{t:'Right Hand Basics',html:`
  <p class="lead">For now the right hand does one thing: a downward stroke with the thumb.</p>
  <section class="block"><div data-w="diag"></div><ul class="points">
    <li><b>Where:</b> pluck over the soundhole area.</li>
    <li><b>Anchor:</b> rest your wrist near the bridge, toward the body. It keeps your hand steady.</li>
    <li><b>How:</b> thumb only, a downward stroke, with the fleshy pad of the thumb.</li>
    <li><b>How hard:</b> firm enough for a clear tone. No harder.</li></ul></section>
  <section class="block"><h3>Try the stroke</h3><div data-w="pad"></div></section>`,
 mount(r){mount(r,'diag',RightHandDiagram());mount(r,'pad',StrumPad());}},

{t:'Tuning',html:`
  <p class="lead">Every practice session starts here. A guitar that's slightly out of tune makes correct playing sound wrong.</p>
  <section class="block"><h3>String names</h3><p class="prose">Thicker to thinner: E A D G B e. Tap a letter to hear it.</p><div data-w="mn"></div></section>
  <section class="block"><h3>Which peg turns which string</h3><p class="prose">Trace the string from the bridge, toward the headstock, past the nut, to the post it winds around. That peg is the one.</p><div data-w="hs"></div>
    <div class="callout warn"><b class="t">Common mistake</b><p>Turning the wrong peg. If the string you're plucking doesn't respond, stop. Don't keep cranking; you're tightening a different string.</p></div></section>
  <section class="block"><h3>Using a tuner</h3><ul class="points">
    <li><b>Phone tuner app</b> or <b>clip-on tuner</b>. There are a ton of free guitar tuner apps out there: just search "guitar tuner." I recommend the Fender Tune app. A clip-on attaches to the headstock and feels the vibration directly, so room noise doesn't confuse it.</li>
    <li><b>One string at a time.</b> Other strings ringing will confuse the tuner. Use a rest stroke: rest your thumb on the string you're tuning, push through it, and let your thumb land on the next thinner string. That keeps the neighboring string quiet. Same thumb motion as Right Hand Basics.</li>
    <li><b>Keep plucking while you turn.</b> Notes fade quickly. Hold the guitar with your right arm, reach the peg with your left hand, and <b>KEEP PLUCKING!</b></li>
    <li><b>Very out of tune?</b> The tuner may not recognize the note. Get it close by ear (use the letters above) first.</li>
    <li><b>Tune twice.</b> Big adjustments shift the tension on the neck. After all six, go back and check them again.</li></ul>
    <h4 class="subhead">Tune up to the note</h4><p class="prose">Always approach the target pitch from below. If you overshoot and go sharp, loosen until you're below the note, then tighten back up. A string tuned up to pitch holds its tuning better. Practice it here.</p><div data-w="tt"></div></section>`,
 mount(r){mount(r,'mn',Mnemonic());mount(r,'hs',Headstock());mount(r,'tt',TunerTrainer());}},

{t:'The Guitar\'s Map',html:`
  <p class="lead">Every note has an address: a string and a fret. Learn to read the address and you can find any note.</p>
  <section class="block"><h3>The fretboard</h3><p class="prose">Drawn as if you're looking at the front of your guitar with the headstock to the left: thinnest string on top, thickest on the bottom. Strings are numbered 1 (thinnest, highest pitch) to 6 (thickest, lowest pitch). Tap any spot to hear it.</p><div data-w="fb"></div></section>
  <section class="block"><h3>How frets are counted</h3><ul class="points">
    <li>The nut is fret 0, the same as an open string.</li>
    <li>When we say "fret," we mean the <b>area between two metal wires</b>, not a wire. The 2nd fret is the area between the 1st and 2nd wires; it's named for the wire on its body side.</li>
    <li>Find the dots on your neck. They're called <b>fret markers</b>. Some guitars also have a dot on the 3rd fret.</li>
    <li>Higher fret numbers are toward the body and higher in pitch. Lower numbers are toward the headstock and lower in pitch.</li></ul></section>
  <section class="block"><h3>Where exactly to put your finger</h3><p class="prose">Put your fingertip in the middle of the fret space, between the two wires. The dots sit in the middle of their spaces, so they make a handy guide: for string 4, fret 5, your finger goes right next to the dot.</p><div data-w="pl"></div></section>
  <section class="block"><h3>Left hand shape</h3><div class="photo-wrap"><figure><img src="${'{{IMG.hands}}'}" alt="Finger numbers: left hand fingers 1 to 4 plus thumb; right hand p i m a"><figcaption>Finger numbers. Left-hand fingers are 1–4 from index to pinky.</figcaption></figure>
    <ul class="points"><li>Thumb behind the neck, roughly behind your middle finger.</li><li>Fingers curved, coming down perpendicular to the fingerboard.</li></ul></div>
</section>
  <section class="block"><h3>How hard to press</h3><p class="prose">Clear tone means enough. Buzzing means press more. Tired hand means too much.</p><div data-w="pr"></div></section>
  <section class="block"><h3>Mini quiz</h3><div data-w="qz"></div></section>`,
 mount(r){mount(r,'fb',Fretboard({frets:12,phoneFrets:5}).el);mount(r,'pl',Placement());mount(r,'pr',Pressure());mount(r,'qz',MapQuiz());}},

{t:'Reading Tab',html:`
  <p class="lead">Tab tells you which string and which fret. It's the quickest way to start playing real music.</p>
  <section class="block"><h3>The six lines</h3><p class="prose">Six lines for six strings. The <b>thinnest string is the top line</b>, the thickest is the bottom line. The numbers are fret numbers; 0 means an open string, which you still pluck.</p>
    <div class="callout tip"><b class="t">Mixed up?</b><p>Look at the front of your guitar with the headstock to the left, the same way the tab is drawn. The thinnest string is on top, just like the top line of the tab.</p></div></section>
  <section class="block"><h3>Try it</h3><p class="prose">Press Play and follow along. It starts with a few notes on the thinnest string, then adds more strings as it goes.</p><div data-w="zig"></div></section>
  <section class="block"><h3>Your turn</h3><p class="prose">The highlighted number in the tab is your next note. Tap that spot on the fretboard: the line tells you the string, and the number tells you the fret. Get it right and the tab moves on to the next note.</p><div data-w="tq"></div></section>
  <section class="block"><h3>Check in</h3><p class="prose">Read tab from left to right, like a sentence: each number is the next note to play. Left to right tells you <b>when</b>. The line and the number tell you <b>where</b>.</p><p class="prose">This is the idea most likely to get tangled. Make sure it's solid before moving on.</p><div data-w="q"></div></section>`,
 mount(r){mount(r,'zig',Player(SONGS.zig,{frets:3,bpm:40}));mount(r,'tq',TabQuiz(SONGS.tq));mount(r,'q',TermQuiz([
   {q:'In tab, a number further to the right means…',o:['play it later','play it closer to the body'],a:0,why:'Yes. Left to right is the order in time.',no:'That\'s the trap. Position on the neck comes only from the number.'},
   {q:'The top line of tab is…',o:['the thickest string','the thinnest string'],a:1,why:'Right. Top line, thinnest string.'},
   {q:'A 0 on the bottom line means…',o:['rest, don\'t play','pluck the thickest string open'],a:1,why:'Yes. 0 is the nut: no finger down, but you still pluck.'}]));}},

{t:'Your First Songs',html:`
  <p class="lead">Four short pieces. Each one adds a single new idea, and the last one turns out to be your first chord.</p>
  <div class="song"><span class="eyebrow">Two strings</span><h3>Seven Nation Army</h3><p class="sub">The whole riff uses just two strings, the D string (string 4) and the A string (string 5). It starts on the open D string.</p><div data-w="s1"></div></div>
  <div class="song"><span class="eyebrow">Open strings, crossing strings</span><h3>Nothing Else Matters · intro</h3><p class="sub">No left-hand fingers at all. With the thumb of your right hand, move from thicker strings to thinner ones and back.</p><div data-w="s2"></div></div>
  <div class="song"><span class="eyebrow">Two fingers</span><h3>Same motion, two fingers down</h3><p class="sub">Put <button type="button" class="fpop">finger 2</button> on the A string, 2nd fret, and <button type="button" class="fpop">finger 3</button> on the D string, 2nd fret. Leave both fingers down the whole time, even while you play the other strings. Play thickest to thinnest, one note at a time.</p><div data-w="s3"></div></div>
  <div class="song"><span class="eyebrow">All six at once</span><h3>One sweep of the thumb</h3><p class="sub">Same two fingers, same strings. Now sweep your thumb across all six in one motion. Stacked numbers in tab mean "play these together."</p><div data-w="s4"></div></div>
  <section class="block"><div class="big-idea"><span class="eyebrow">Reveal</span><h3>You just played an Em chord!</h3>
    <p class="prose">Here's a map of what your fingers were doing. A chord diagram is a picture of the neck standing up: headstock at the top, thicker strings on the left.</p>
    <div class="chords"><div data-w="em"></div><ul class="points" style="flex:1;min-width:220px"><li>Circle above a string: play it open.</li><li>Dot: put a finger here. The number is which finger.</li><li>Finger 2 on the A string, finger 3 on the D string, both at the 2nd fret. Exactly what you just did.</li></ul></div></div></section>`,
 mount(r){mount(r,'s1',Player(SONGS.sna,{frets:3,bpm:95}));mount(r,'s2',Player(SONGS.nem,{frets:3,bpm:70}));mount(r,'s3',Player(SONGS.nemEm,{frets:3,bpm:70}));mount(r,'s4',Player(SONGS.emStrum,{frets:3,bpm:70}));mount(r,'em',Chord(CH.Em));}},

{t:'Chord Diagrams',html:`
  <p class="lead">Tab and chord diagrams show the same notes two different ways. Tab is the order in time. A chord diagram is a snapshot of your hand at a given moment.</p>
  <section class="block"><h3>Reading a diagram</h3><ul class="points">
    <li>Headstock at the top; the thick bar is the nut.</li>
    <li>Thicker strings on the left, thinner on the right.</li>
    <li>Circle: play open. ✕: don't strum that string. Number in a dot: which finger.</li></ul>
    <div class="chords"><div data-w="em"></div><div data-w="am"></div></div>
    <p class="cap">See the ✕ above the thickest string in the Am diagram? That means don't strum it. Start your thumb sweep on the A string instead.</p></section>
  <section class="block"><h3>Em to Am</h3><p class="prose">Chord names sit above the tab. Each stack of numbers is one sweep of the thumb. Four sweeps, then change.</p><div data-w="ea"></div></section>`,
 mount(r){mount(r,'em',Chord(CH.Em));mount(r,'am',Chord(CH.Am));mount(r,'ea',Player(SONGS.emAm,{frets:3,bpm:70}));}},

{t:'Em and Am Songs',html:`
  <p class="lead">Real songs built from the two chords you know.</p>
  <div class="soon"><b>Still being written</b><p>This section is next in the book. The Em–Am exercise in Chord Diagrams is the warm-up for it.</p></div>`,
 mount(){}}
];

/* ---------- shell ---------- */
const nav=document.getElementById('nav'),main=document.getElementById('main');
let done=new Set(store.get('done',[]));let cur=0;
function renderNav(){
  nav.innerHTML=L.map((l,i)=>`<li><button type="button" data-i="${i}" aria-current="${i===cur}"><span class="n">${i+1}</span><span class="t">${l.t}</span><span class="ck${done.has(i)?' done':''}"></span></button></li>`).join('');
  const n=done.size;document.getElementById('progText').textContent=`${n} of ${L.length} sections done`;document.getElementById('progBar').style.width=`${n/L.length*100}%`;
  const a=nav.querySelector('[aria-current="true"]');if(a&&nav.scrollWidth>nav.clientWidth)nav.scrollTo({left:a.offsetLeft-16,behavior:'smooth'});
}
function go(i,scroll=true){
  STOP_ALL.forEach(f=>f());STOP_ALL=[];
  cur=Math.max(0,Math.min(L.length-1,i));store.set('cur',cur);
  try{history.replaceState(null,'','#s'+(cur+1));}catch(e){}
  const l=L[cur];
  const art=h(`<article class="lesson"><header><span class="eyebrow">Section ${cur+1} of ${L.length}</span><h2>${l.t}</h2></header>${l.html.replace(/\{\{IMG\.(\w+)\}\}/g,(_,k)=>IMG[k])}
    <nav class="pager">${cur>0?`<button type="button" class="btn prev"><small>Back</small>${L[cur-1].t}</button>`:''}
      ${cur<L.length-1?`<button type="button" class="btn primary next"><small style="color:inherit">Done · next</small>${L[cur+1].t}</button>`:`<button type="button" class="btn primary next"><small style="color:inherit">Finish</small>Mark this section done</button>`}</nav></article>`);
  main.replaceChildren(art);l.mount(art);
  art.querySelectorAll('h2,h3,.eyebrow').forEach(e=>{e.innerHTML=e.innerHTML.replace(/\b([A-G])m\b/g,'<span class="chn">$1m</span>');});
  art.querySelector('.prev')?.addEventListener('click',()=>go(cur-1));
  art.querySelector('.next').addEventListener('click',()=>{done.add(cur);store.set('done',[...done]);cur<L.length-1?go(cur+1):renderNav();});
  renderNav();if(scroll)window.scrollTo({top:0});
}
// "finger 2" style reminders: tap to see the finger-number picture.
const fpop=h(`<div class="fpop-card" role="dialog" aria-label="Finger numbers" hidden><div class="fpop-img"><img src="${IMG.hands}" alt="Left hand with fingers numbered 1 index, 2 middle, 3 ring, 4 pinky"></div><p><b>Left-hand fingers:</b> 1 index · 2 middle · 3 ring · 4 pinky</p></div>`);
document.body.append(fpop);
document.addEventListener('click',e=>{
  const b=e.target.closest('.fpop');
  if(!b){if(!e.target.closest('.fpop-card'))fpop.hidden=true;return;}
  const r=b.getBoundingClientRect();fpop.hidden=false;
  fpop.style.top=(window.scrollY+r.bottom+8)+'px';
  fpop.style.left=Math.max(12,Math.min(window.scrollX+r.left,window.scrollX+document.documentElement.clientWidth-fpop.offsetWidth-12))+'px';
});
nav.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)go(+b.dataset.i);});
const hm=/^#s(\d+)$/.exec(location.hash);go(hm?(+hm[1]-1):store.get('cur',0),false);
</script>

<div class="update" id="update-banner" role="status" hidden><span>A new version is ready.</span><button type="button" class="btn primary" id="update-btn">Update</button></div>
<script>
// Offline support + update banner. See sw.js.
(async () => {
  if (!('serviceWorker' in navigator)) return;
  const reg = await navigator.serviceWorker.register('sw.js');
  const banner = document.getElementById('update-banner');
  const offer = (worker) => {
    banner.hidden = false;
    document.getElementById('update-btn').onclick = () => worker.postMessage('skipWaiting');
  };
  if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
  reg.addEventListener('updatefound', () => {
    const worker = reg.installing;
    worker.addEventListener('statechange', () => {
      if (worker.state === 'installed' && navigator.serviceWorker.controller) offer(worker);
    });
  });
  const hadController = Boolean(navigator.serviceWorker.controller);
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  // Home Screen apps rarely restart, so check for updates whenever the app is reopened.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && navigator.onLine) reg.update();
  });
})();
</script>
